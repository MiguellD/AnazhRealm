<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- tetrapoda-Portal (Nachlese-Welle, W-A4c-Muster) — eigenes Document, eigene strikte CSP:
     Skript nur same-origin (tetrapoda.js + ../../tetrapoda-core.js + ../terrain/lib/ — Three.js r128
     vendored vom geteilten Regal, kein CDN mehr; die Shell wanderte dafür byte-treu
     aus dem Inline-Skript nach tetrapoda.js, das schmiede.js/fachwerk.js-Muster). Die
     iframe-Sandbox trägt die Isolation; die W12-Brücke am Ende von tetrapoda.js
     spricht die Heimat (enter/ready/dsl/exit). -->
<meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; object-src 'none';"
/>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tetrapoda — Evolution Lab (Aureus)</title>
<link rel="stylesheet" href="../huelle/huelle.css?v=18.546.121">
<style>
body{margin:0;overflow:hidden;background:#050505}canvas{display:block}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#aa8855;font-family:monospace;font-size:14px;z-index:200;letter-spacing:2px}
#ui{position:absolute;top:10px;left:10px;z-index:300;background:rgba(15,12,6,0.92);padding:14px;border:1px solid #443311;border-radius:6px;font-family:monospace;font-size:11px;color:#aa8855;max-width:280px}
#presets{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
#presets button{background:#221100;color:#ccaa66;border:1px solid #553311;padding:4px 10px;font-family:monospace;font-size:11px;cursor:pointer;border-radius:3px}
#presets button:hover{background:#332200}
#presets button.active{background:#443311;color:#ffcc88}
/* Regler · Sitzung · Kosten-Leiste formt die Hülle (../huelle/huelle.css) — hier nur die Palette (Aureus) */
:root{--h-akzent:#ccaa66;--h-tinte:#ddc89a;--h-matt:#886633;--h-haar:#221100;--h-feld:rgba(14,10,4,.9);--h-knopf:rgba(204,170,102,.12)}
#gangartZeile{margin-top:4px;font-family:monospace;font-size:10px;color:#ccaa66}
#emotions,#stufen{margin-top:8px;display:flex;gap:3px;flex-wrap:wrap;align-items:center}
#stufeIst{margin-left:6px;color:#886633}
#emotions button,#stufen button{background:#221100;color:#ccaa66;border:1px solid #553311;padding:4px 8px;font-family:monospace;font-size:10px;cursor:pointer;border-radius:3px}
#emotions button:hover,#stufen button:hover{background:#332200}
#emotions button.active,#stufen button.active{background:#443311;color:#ffcc88}
</style>
<script src="../terrain/lib/three-r128.min.js"></script>
<script src="../terrain/lib/OrbitControls.js"></script>
<script src="../terrain/lib/CopyShader.js"></script>
<script src="../terrain/lib/LuminosityHighPassShader.js"></script>
<script src="../terrain/lib/FXAAShader.js"></script>
<script src="../terrain/lib/EffectComposer.js"></script>
<script src="../terrain/lib/RenderPass.js"></script>
<script src="../terrain/lib/MaskPass.js"></script>
<script src="../terrain/lib/ShaderPass.js"></script>
<script src="../terrain/lib/UnrealBloomPass.js"></script>
</head>
<body>
<div id="loading">Erwacht in Gold...</div>
<div id="ui">
<div id="sitzung"></div>
<div id="presets"><button data-p="wolf" class="active">Wolf</button><button data-p="fox">Fuchs</button><button data-p="bear">Baer</button><button data-p="deer">Hirsch</button></div>
<div id="sliders"></div>
<div id="stufen"><button data-s="auto" class="active">Stufe auto</button><button data-s="0">L0</button><button data-s="1">L1</button><span id="stufeIst"></span></div>
<div id="emotions">
<button data-e="idle" class="active">Entspannt</button>
<button data-e="joy">Freude</button>
<button data-e="hunt">Jagd</button>
<button data-e="flee">Flucht</button>
<button data-e="alert">Wachsam</button>
<button data-e="showcase">Showcase</button>
</div>
<!-- DIE GANGART AUS DEM TEMPO (Labor = Welt): v̂ = v/√(g·L), das Gang-Gesetz der Welt wählt Schritt, Trab, Galopp -->
<div id="gang"></div><div id="gangartZeile">Gangart <span id="gangart">stand</span></div>
<!-- DER EINE ÜBERGABE-KANAL: hier setzt die Hülle im Portal ihren Knopf „In der Welt ansehen" (bruecke, opt.werk). -->
<div id="werkOrt"></div>
<div id="kosten"></div>
</div>
<script src="../../tetrapoda-core.js?v=18.546.121"></script>
<!-- LABOR = WELT (K45): DERSELBE Bäcker wie Foundry-Worker und Wirts-Ofen (BAKERS_BY_KIND.kreatur) — die gezeigte Gestalt IST der Welt-Guss -->
<script src="../../koerper-core.js?v=18.546.121"></script>
<script src="../../foundry-core.js?v=18.546.121"></script>
<script src="../huelle/huelle.js?v=18.546.121"></script>
<script src="tetrapoda.js?v=18.546.121"></script>

</body>
</html>
