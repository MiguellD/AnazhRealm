              # ist K1 rot beim Namen, ebenso ein Manifest ohne Soll-Zeile) · K2 der Handshake endet (höchstens 3 enter;
              # vorher 106 bis 202 Runden Ping-Pong je Studio) · K3 eine fremde Seite steuert keine Welt · K4 die chain-Form wirkt sichtbar (Journal
              # der Heimat bzw. Zustand der Welt-UI; dazu die Probefahrt der Garage und das bewegte Bild der Strom-Welt) ·
              # K5 Esc bringt heim · K6 keine Seiten-Fehler · K7 die Welt zeigt das Mitgebrachte (skeleton: Seele, eigenes
              # Material als Text mit gesäuberter Farbe, Werkzeug, Vibe-Pass; fluid/terrain: Vibe-Pass am Namen) · K8 was der
              # Spieler trägt (Leib, Inventar, Gehaltenes) steht vor dem Tor, drüben in der Hülle und daheim byte-gleich.
              # Ratschen (spec/vertraege/ratsche.json): DSL-Einzelwort stumm 7 → Soll 0 · ready-Echo 7 → 0.
              # --selftest zuerst: begegnung ohne Quellen-Prüfung, die Heimat beantwortet jede ready, skeleton mit
              # Element-Adapter und Markup-Panel, skeleton und terrain ohne Manifest (der Server antwortet 404), fluid
              # meldet ihr Manifest ohne „flut", die garage trägt eins ohne Soll-Zeile, die Hülle lässt das Gehaltene
              # fallen → jede Wand rot und beim Namen.
              run: npm run gate:portal-konformanz

            - name: Regler wirkt Teil 1 (W1 d — jede PARAMS-Zeile bewegt den Bau am Kanal der Werkstatt, tote Regler beim Namen)
              if: matrix.gruppe == 6
              # Je Art an dem Kanal, den die Werkstatt-Vorschau nimmt: die MESHFREI-Arten (koerper · kreatur · klang) gießt
              # der Host-Ofen der echten Heimat (Null-Renderer, der Wert aus ws.studioOv), die übrigen baut die echte
              # Foundry-Brücke (asset-worker-harness, ov {id: min|max}). Tot = bewegt an keinem Rezept seiner Art den Hash;
              # BRICHT (rot) = der Bau wirft, bleibt leer, trägt NaN oder den Not-Körper. Ratschen (spec/vertraege/ratsche.json):
              # reglerTot 17 von 112 → Soll 0 · reglerBudget (ein Rand treibt eine Stufe über ihre Zeile) 3, Staffel 3 → Soll 0 ·
              # quote (L1/L0 ≤ 0,5, L2/L0 ≤ 0,15) 3. Die STUFEN-Probe (pipeline.K3) baut jede Stufe × Rezept × Regler-Rand
              # (6 527 Bauten); Wirkung und WURF lesen dieselben Bauten, eine Stufe ohne Teile ist rot. --selftest zuerst:
              # die Brücke ohne ov → jeder vehicle-Regler tot; ein Regler-Bau, der wirft bzw. NaN rechnet → BRICHT; der Ofen
              # ohne den Wert → jeder koerper-Regler tot; der Mensch-Bäcker wirft → Not-Körper → BRICHT; die Ausstattung ohne
              # Reduktion → brunnen L1 über der Zeile und der Quote, ohne Teile → LEER. WURF (1110-9): die NUR-WURF-Stufe am
              # Regler-Rand richtet die Kosten-Regel des Wirts (volle Regler-Hülle, 1 324 Paare); der Täter „der Zwilling wirft
              # immer" → rot an kathedrale. Drei Teile in drei Gruppen (229 s in einem Schritt, das Haus allein 207–220 s): Teil 1
              # alle Arten ohne das Haus samt Ofen und Selbsttest, Teil 2 und 3 das Haus (3 936 der 6 527 Bauten), seine Regler
              # abwechselnd; jeder Teil richtet nur die Ratschen-Zeilen seiner Regler (die Quote nach ihrem Zeugen), die Staffel
              # zählt die anderen Teile aus der Ratsche; `npm run gate:regler-wirkt` fährt alle drei.
              run: node scripts/diag-regler-wirkt.cjs --teil=1

            - name: Regler wirkt Teil 2 (das Haus, Grund-Bau und jeder zweite Regler — jede Stufe x Rezept x Regler-Rand gegen ihre Budget-Zeile)
              if: matrix.gruppe == 1
              run: node scripts/diag-regler-wirkt.cjs --teil=2

            - name: Regler wirkt Teil 3 (das Haus, die uebrigen Regler — jede Stufe x Rezept x Regler-Rand gegen ihre Budget-Zeile)
              if: matrix.gruppe == 11
              run: node scripts/diag-regler-wirkt.cjs --teil=3

            - name: Die Studio-Dither-Blende (W5.3+W5.4 — Masken-Quelle + CPU-Doppel-Mitgliedschaft)
              if: matrix.gruppe == 8
              # DER CROSSFADE-BEWEIS, dreiteilig: (Selbst-Test) verfälschte phyto-core-Kopien machen
              # die Linse rot (nicht vakuös); (a) Node-pur: __phytoCore.lodCrossfadeMask == die per
              # Regex geparste foundry-core-GLSL (FIX v37 — Rinde XOR-Partition, Laub überlappende
              # Rampen ohne Loch, Impostor-fin; die Drift-Wand gegen jeden Studio-GLSL-Edit);
              # (b) headless foundry-ON: der Distanz-Sweep über thresh01/thresh12 — IM Band Slots
              # in BEIDEN Stufen-Gruppen, außerhalb exakt einer, nie 0, Slot-Bilanz dicht (kein Leck).
              run: npm run gate:foundry-crossfade

            # ── DIE WÄNDE OHNE WORKFLOW (09.10., gate:ci-deckung (W)) ── Bis hier liefen 50 der 152 `gate:*` nirgends
            # automatisch. Die folgenden 29 fahren headless (Null-Renderer, swiftshader nur für Rechen- und Bäcker-Proben)
            # und liefen am 09.10. lokal grün (foliage-res und membran-gesetz nach der Heilung ihrer Proben); verteilt nach
            # Familie und Gewicht, Gruppe 1 Kreatur und Übergabe, Gruppe 2 Regler und Leistung, Gruppe 3 Wasser und
            # Studio-Naht. Am 10.10. kam gate:webgl-probe dazu (echter Renderer auf swiftshader-GL); gate:arch-feld trägt den
            # Deckel des Läufers nicht (Lauf 38005574907) und steht mit Klasse FRIST in AUSNAHMEN (scripts/diag-ci-deckung.cjs);
            # wer nur abgeschaltet läuft (nächtlich, || true, continue-on-error), ist (S) rot.
            - name: Reload-Treue (die Kreatur kehrt nach dem Reload wie gegossen wieder)
              if: matrix.gruppe == 4
              run: npm run gate:reload-treue

            - name: Studio-Übergabe (die Live-Bearbeitung eines Studios reist in die Welt)
              if: matrix.gruppe == 8
              run: npm run gate:studio-uebergabe

            - name: P2P-Gestalt (die Studio-Übergabe reist zu den Mitspielern)
              if: matrix.gruppe == 2
              run: npm run gate:p2p-gestalt

            - name: Prägung-Welt (die Prägung reist mit dem Artefakt in die Welt-Pfade)
              if: matrix.gruppe == 5
              run: npm run gate:praegung-welt

            - name: Scatter-LOD (die Streu-Stufen folgen der Live-Distanz, ohne Flacker-Churn, über Region-Grenzen)
              if: matrix.gruppe == 7
              run: npm run gate:scatter-lod

            - name: Erstarren-Linse (kalter Boot, Wander-Lauf ohne Todes-Spirale, ein Tor-Material genau einmal gebaut)
              if: matrix.gruppe == 7
              run: npm run gate:erstarren

            - name: GPU-Zeit-Linse (headless der Proxy, die echte Leitung über ein API-treues Fake-Backend)
              if: matrix.gruppe == 2
              run: npm run gate:gpu-zeit

            - name: Render-Diät (ein geteiltes Material je Tag-Signatur, die Part-Farbe reist als Instanz-Farbe)
              if: matrix.gruppe == 12
              run: npm run gate:render-diaet

            - name: Fern-Ring (jenseits des Streaming-Rings zeichnet das EINE Höhen-Gesetz, der Feld-Zeichner auf swiftshader)
              if: matrix.gruppe == 16
              run: npm run gate:fern-ring

            - name: WebGL2-Rückfall (ohne WebGPU-Adapter bootet die Welt laut benannt auf GL und lebt)
              if: matrix.gruppe == 16
              # swiftshader-GL (__anazhForceWebGL, der EINE Hook): W1 der Backend ist WebGL, W2 der Rückfall wird einmal laut
              # benannt, W3 Feld-Pass und Region-Bundles ruhen, W4 der Fern-Ring verfeinert auf CPU, W5 Takte laufen, der Canvas
              # nach dem echten Frame trägt Substanz und jedes Programm, das das Spiel baut, linkt (sonst ROT beim Stoff-Namen),
              # W6 (holz=voll) jeder Stoff trägt je Stufe ≤ 16 aktive Sampler-Einheiten, gezählt im GLSL ohne Link.
              run: npm run gate:webgl-probe

            - name: Stall-Akte (die Boot-Lib nennt eine stehende Seite beim Namen - JS-Schleife mit Stapel, Versprechen am Fristriss)
              if: matrix.gruppe == 13
              # K67: jede Seite der Boot-Lib trägt Puls und Stempel; steht der Puls ≥ 20 s oder reißt eine Frist, schreibt
              # scripts/lib/welt-boot.cjs die Akte ins Log (Phase, Stempel, CPU je Prozess, Stapel, GPU-Spur, Stderr, Urteil).
              run: npm run gate:welt-boot

            - name: Fern-Wasser (die Atlas-Kulisse jenseits des Chunk-Rings baut mit vollem Material-Vertrag)
              if: matrix.gruppe == 4
              run: npm run gate:fern-wasser

            - name: Warm-Start (der zweite Boot liest den Ring byte-gleich aus der Platte, ein Edit geht am Cache vorbei)
              if: matrix.gruppe == 13
              run: npm run gate:warm-start

            - name: Kopplung (die Welt fasst den Körper an — Strömung, Gleiten, Wind-Richtung, Gras-Biegung)
              if: matrix.gruppe == 13
              run: npm run gate:kopplung

            - name: Tor-Wurf und Tor-Fernform (1110-9 — die NUR-WURF-Stufe 3 der Tore, die Fernform ≤ 24 sicht-Teile)
              # Gruppe 9 (die leichteste, 8,9 min Median): in Gruppe 4 trug sie nach main bb554abf 11,6 min (Waage 11).
              if: matrix.gruppe == 11
              run: npm run gate:tor-fern

            - name: Portal-Membran (die Passage ist integriert und zeichnet nur im Blick)
              if: matrix.gruppe == 18
              # Null-Renderer: Kollision der Gesetz-Huelle, Membran baut und atmet, Hindurchgehen ist Betreten. Dann der
              # ECHTE Frame am Genesis-Ring (swiftshader, kienspan): aus der Mitte zeichnen Membranen, die im Ruecken nicht
              # alle; 70 m vor dem Ring mit dem Blick vom Ring weg keine Membran und kein Nebel (Taeter beim Namen); die
              # Huelle traegt die Amplitude der Welle; mit frustumCulled = false nennt der Selbsttest jede Membran.
              # Gruppe 3 seit der Vereinigung mit waende-ci (EIN Schritt): sie lief in integ-probe ce10dcb6 (Lauf 38092890885)
              # 19,3 min, Gruppe 1 22,5 min, Gruppe 2 26,6 min; der Schritt kostet im Zweig 21 s (Lauf 38021693010).
              run: npm run gate:portal-membran

            - name: Chunk-Naht (same-LOD-Ränder koinzident, Cross-LOD-Paare gestreamt, kein ungedeckter Spalt)
              if: matrix.gruppe == 8
              run: npm run gate:seam

            - name: Mehrspieler-Wand (zwei Seiten, echter signaling-server - Tuer, Knopf, Boot, kein Mitspieler im Ursprung)
              if: matrix.gruppe == 10
              # K04: der nackte Aufruf heilt nach Server-Ausfall (Rejoin), der Knopf liest die EINE Absicht, der Mitspieler
              # erscheint erst an seinem Ort; der Selbsttest setzt die alte Tuer ein und sieht (b) ROT. K23 (c): das Chat-Graben
              # kommt bei B GENAU einmal an (jeder Edit von A, und B traegt keinen mehr); im Hauptlauf wendet B danach jede
              # Graben-Nachricht doppelt an und (c) muss ROT werden (die erste Fassung, ohne die Laenge, blieb gruen).
              # K60 (d): der Ghost bei B verbraucht erst je 20 angekommene Schritte (lange Takte in Schritten, nie in ms), und
              # jeder Takt haelt das Gesetz von _lockstepTickPeers: Verbrauch bis zur Kappe der Wanduhr ceil(10 x dt/FIXED_DT)
              # oder bis zur Reserve (taktBruch); der Schub vor dem Fenster haelt es, die alte Kappe je Frame muss am Gesetz ROT werden.
              run: npm run gate:mp-sync

            - name: Die V1-Pfad-Linse (Welle L - Vorschau, Ankunft, Eingabe, Wort, KI-Fehler)
              if: matrix.gruppe == 9
              # Die Defekte der Leben-Pruefung auf dem gespielten v1.0-Pfad, je beim Namen: jede Probe ruft den
              # Chokepoint selbst im echten Boot (headless, foundry-ON) und misst seine Wirkung; der Selbsttest
              # bricht jede Stelle einzeln. WORT: der KI-Korpus (40 Saetze) mit dem Mitschnitt des echten Modells ueber den
              # echten Chat-Pfad - der echte Lauf (--korpus --echt, lokales ollama) ist nicht CI-Pflicht.
              run: npm run gate:v1-pfad

            - name: Die Werkstatt-Weg-Linse (Welle L Folge - v1-Schritte 3 und 4, Werkstatt bauen und KI erschaffen)
              if: matrix.gruppe == 13
              # Die Defekte der sichtbaren Leben-Schau 07.10. auf dem Weg Satz/Werkstatt -> stehendes Werk, je beim Namen,
              # im echten Boot (headless, foundry-ON); L-WERKSTATT faehrt echte Eingaben (Tasten, Klicks, Rad) und zaehlt sie
              # am Ereignis-Strom (<= 3 bis zum stehenden Werk); der Selbsttest bricht Verdikte und Wand je einzeln.
              run: npm run gate:werkstatt-weg

            - name: Die Kamera-Laub-Linse (K06 - Laub, Strauch und Fels vor der Linse, die Nah-Kugel der Durchsicht)
              if: matrix.gruppe == 12
              # An vier Orten der Leben-Schau 2 je Pflanze acht Stellungen zu Fuß, im Ritt und im Ich-Auge: die Nah-Deckung
              # des Schirms je Täter-Klasse (scripts/lib/kamera-nah.cjs); der eingeschmuggelte Laub-Stoff und Fels müssen beim
              # Namen fallen, der Selbsttest nennt jeden Bruch und die statische Wand feuert am Vor-Stand.
              run: npm run gate:kamera-laub

            - name: Die Kamera-Leib-Linse (K06 - WE-05, FZ-07, NP-03 - nie im Fels, nie unter dem sichtbaren Boden, nie in einer Box)
              if: matrix.gruppe == 14
              # 50 feste Posen (40 Mess-Wiese, 10 Prüfbühne s2-hang30) zu Fuß und im Verfolger-Ritt gegen die exakte Gestalt,
              # die Feld-Proben je 3rd-Bild, die Sprünge im Rundgang; NP-03 48 Posen im Körper-Studio, NP-02 der Tunnel.
              # K4 der Gang (leib.K4): Third zu Fuß im echten Takt an Stamm, Fels und Haus (rückwärts heran, 360°-Orbit) — die
              # Kugel der Linse nie in Fels oder Bau, keine Nah-Pixel, Ruck p95 ≤ 0,02 m; der Arm ohne Kollision ist ROT.
              # Seit gpu-wand (0c033fb9) zeichnet sie unter --bild auf SwiftShader: 42–65 s wurden 318–898 s je Läufer — die Waage
              # stellt sie allein in ihre Gruppe (p90 898 s, 15,2 min samt Vorbereitung).
              run: npm run gate:kamera-leib

            - name: Die Ankunfts-Linse (Welle L Folge - Ladeschirm, Fadenkreuz, Hilfe, Chat-Taste, Start-Gurt, Kamera im Baum, Dorf vor dir)
              if: matrix.gruppe == 5
              # Die Defekte der sichtbaren Leben-Schau 07.10. auf den v1-Schritten 1-2, je beim Namen: jede Probe ruft den
              # Chokepoint selbst im echten Boot (headless, foundry-ON); der Selbsttest nennt jeden Befund-Zustand und
              # die statische Wand feuert am Vor-Stand.
              run: npm run gate:ankunft

            - name: Die GPU-Fehler-Linse (Welle L - V-D7, Selbsttest)
              if: matrix.gruppe == 16
              # Die Werkbank nennt jede WebGPU-Validierung mit Pass und Objekt (scripts/lib/gpu-fehler.cjs); der
              # Selbsttest zeichnet auf einer nackten WebGPU-Seite einmal ohne Vertex-Slot - die Linse muss ihn nennen.
              run: npm run gate:gpu-fehler

            - name: Wasser-Wand (Welle L — Q6 + Q7, die Proben rufen die Chokepoints selbst)
              if: matrix.gruppe == 10
              # Null-Renderer an der Mess-Wiese (Sync-Bau, Worker ausgehängt): der Fluss-Spiegel stromab nie steigend,
              # quer waagrecht, die Quelle ein Rinnsal, die Bank nie steiler als der Fels, Kanal Main = Worker; der
              # Körper nach seiner Gestalt im Wasser (Hineingehen, Brustkorb-Linie, Kraulen, Eintauchen, Tier, Mitspieler,
              # Licht, Medium), die Decke über trockenen Höhlen, der Wagen watet und das Boot treibt, keine Ufer-Flut,
              # Klang · Tier-Scheu · Küsten-Sheet lesen die EINE Wahrheit, die Ufer-Bänder stetig über die Krone. --selftest
              # zuerst. K61: die Quell-Probe (die 12 Kacheln QUELL_KACHELN, 328 Quellen, 87 % der Wand) fährt in drei
              # Seiten nebeneinander (WASSER_QUELL_TEILE), jede Seite stellt die Kacheln selbst her, das Ganze urteilt
              # über dieselben Quellen (F5 KACHELN: eine fehlende Kachel ist rot).
              run: npm run gate:wasser-leben

            - name: Werk im Wasser (Schau-2 — der Hain am Fluss, das Dorf am Ufer, der Wagen in der Furt, der Damm im Reload)
              if: matrix.gruppe == 12
              # Der Schau-Ablauf am Fluss −872/−1127 im echten Spiel-Takt (Bau-Eiche, „pflanz mir einen eichenhain am
              # wasser", 1200 Takte): kein Stamm unter dem gezeichneten Wasser, der Wasser-Automat schläft; jedes gesetzte
              # Werk (Wald, Hain, Dorf mit Fundament) vor seinem Stempel gegen Bild UND Gesetz des Wassers; der GT in einer
              # Furt bremst (1 s nach dem Eintauchen ≤ 50 %), die Kamera nie unter dem Spiegel; die Leser der EINEN
              # Wasser-Wahrheit statisch; der Wasser-Term des Kerns (ohne Tiefe byte-gleich, die EINE Masse des Wagens).
              # D: ein Damm quer über den Fluss in einer frischen Welt, 1200 Takte, gespeichert, neu geladen — der Stausee
              # bildet sich neu (nasse Punkte ± 10 % des Staus), sein Abbau weckt den Automaten. R: das Nexus-Dorf am Seerand
              # weckt den Automaten nicht, das Wasser bleibt (± 1 %). E: jeder Setz-Op mit erzwungenem Fehl-Grund sagt die
              # tatsächliche Zahl und den Grund. A (Karte K02, FZ-01): der GT fährt mit Vollgas die Rampe der Furt hinab —
              # 3 s nach der Ansaugung ≤ 0,5 m/s, kein Vortrieb, nie über das Dach im Wasser; der Ausstieg an Land steht
              # neben dem Wagen, im See (≥ 1,35 m) schwimmt er; K6: der Wasserschlag sperrt die Räder am Hang.
              # --selftest zuerst. ~3 min.
              run: npm run gate:werk-im-wasser

            - name: GPU-Churn-Linse (echter Renderer — die Klasse hinter dem V18.322-Idle-Freeze)
              if: matrix.gruppe == 18
              # Die STEHENDE Linse gegen „eine pro-Frame/periodisch neu kompilierte GPU-Pipeline im
              # Steady-State" (scene.environment-Identitäts-Churn → Recompile-Cascade = der Idle-Freeze,
              # der 50+ Versionen überlebte). Der Null-Renderer-Playtest oben ist dafür STRUKTURELL
              # blind (er stubt den GPU-Pfad); diese Linse fährt den ECHTEN Renderer (swiftshader) und
              # zählt createRenderPipeline/linkProgram. Nach Warmup MUSS eine Env-Regenerierung 0
              # Pipelines neu kompilieren — sonst exit≠0 und der Build wird ROT, bevor jemand friert.
              run: npm run gpu-lens

            - name: Nah-Linse (echter Renderer — kein Analog-Satz diesseits der Nah-Grenze 64 m)
              if: matrix.gruppe == 14
              # Nah und mittel ist das Studio-Mesh die Gestalt, das Analog-Feld trägt erst jenseits ANALOG_NAH_M. Fährt
              # den ECHTEN Renderer (swiftshader) an der Mess-Wiese und liest `_analogZensus` (jeder zeichnende Satz
              # < 64 m beim Namen: Klasse · Träger · Abstand · seit wann · warum kein Mesh; ein hängender Schwund zählt):
              # eingeschwungen satzfrei, Ruhe ohne Satz und ohne Karten-Brücke < 64 m, nach 400 m fort und zurück
              # satzfrei binnen 120 Takten. --selftest zuerst: ein
              # erzwungener Kapsel-Satz in 20 m wird rot und genannt.
              run: npm run gate:analog-nah

            - name: Frost-Wand (echter Renderer — das Weltbild folgt der Kamera durch Werkstatt, Ich- und Hof-Buehne)
              if: matrix.gruppe == 15
              # Befund 07.10. (Leben-Schau v1-Pfad, echte GPU): nach Tab stand das Weltbild - das Backend der Ich-Buehne weitete
              # die geteilten Mensch-Indizes (r184 schreibt die geweitete Form in das Attribut zurueck), die Welt band uint32 auf
              # 16-bit-Puffern, Dawn verwarf jeden Render-Kontext. Faehrt den Spielpfad am ECHTEN Renderer (swiftshader, kienspan):
              # je Schritt folgt das Bild der gedrehten Kamera, jeder Index-Puffer der Welt traegt sein Format, kein Device meldet,
              # die Wachen des Spiels schweigen; danach die Taeter (Index ueber der Vertex-Zahl, ein fremd geweiteter Mensch-Index):
              # die Index-Wache nennt beide beim Namen, die GPU-Wache zaehlt, das stehende Bild wird erkannt.
              run: npm run gate:weltbild-frost

            - name: Post-Kette (echter Renderer — der Direktpfad zeichnet mit Tiefe, jede Nachbild-Stufe kostet nur, wenn sie zeigt)
              if: matrix.gruppe == 15
              # Gruppe 2 seit der Vereinigung mit waende-ci: Gruppe 1 lief in V18.538 (Lauf 38033163539) 24,4 min, mit den
              # sieben Kreatur- und Übergabe-Wänden geschätzt 25,4 — Gruppe 2 lief 12,5 (die Post-Kette dort 202 s).
              # Faehrt den ECHTEN Frame (swiftshader, kienspan) durch die Weiche: Post-Kette, Direktpfad (wie die
              # Zerleg-Linse ihn stellt), zurueck, ein Render-Fehler der Kette — je Schritt kein Fehler, der Leser der
              # Szenen-Tiefe kopiert, der Direktpfad zeichnet mit Tiefe (die nahe Kiste deckt die ferne), die Post-Kette
              # ohne Leinwand-Tiefe. Dazu die Shader-Kosten-Linse am erzeugten WGSL der Ausgabe (hoechstens 9 unbedingte
              # Abtastungen, Godrays und Kontrast im Zweig hinter ihrer Staerke) und die Godrays mit der Sonne im Bild.
              run: npm run gate:post-kette

            - name: Kamera-Treue und Stand-Wand (echter Renderer — der Replay zeichnet wie der direkte Pfad, im Stand arbeitet die Diät nichts doppelt)
              if: matrix.gruppe == 18
              # Faehrt den ECHTEN Renderer (swiftshader, kienspan, Schatten an) an einer eigenen Buehne: die Aufnahme verfolgt
              # jeden Draw trotz Schatten-Render, kein Bundle unter dem Override-Stoff, der Replay zeichnet Blick Y wie der
              # direkte Pfad. Dazu die STAND-WAND (Welle K): Programme mit denselben Quellen teilen EINE geteilte Gruppe, im
              # Stand je Render kein Voll-Refresh, kein Upload, kein zweiter Gang ueber einen Knoten oder eine Gruppe; eine
              # Aenderung im Stand zeichnet wie der volle Refresh; VERSCHACHTELT: ein Schatten-Render, dessen Werfer ohne
              # Diaet die Kamera-Knoten ueber die Vendor-Bahn stellt, laesst keinen Stempel ueberleben (181d3c9e: 0,11).
              # --selftest zuerst: injizierte Taeter fallen rot.
              run: npm run gate:kamera-treue

            - name: Ego-Schatten (echter Renderer — in der Ego-Sicht wirft der Leib seinen Schatten, das Auge sieht ihn nicht)
              if: matrix.gruppe == 15
              # voll 10 (die leichteste Gruppe, 7,4 -> 7,7 min; 17 s aus Lauf 38038945137/1 in spec/ci/ci-zeiten.json).
              # Faehrt den ECHTEN Renderer (swiftshader, kienspan, Schatten an) an einer eigenen Buehne mit dem echten Leib des
              # Spielers, der echten Ego-Regel (_applyEgoSicht) und der echten Haupt-Kamera am Auge: in der Ego-Sicht wirft der
              # Leib (Schatten-Maske am Boden, IoU >= 0,9 gegen dieselbe Pose in der 3rd-Person), die Haupt-Kamera sieht 0
              # Bildpunkte Leib, das Geraet in der Hand bleibt auf Ebene 0, ein Zwilling bleibt in den Kaskaden, 3rd gibt jede
              # Maske zurueck. Fuenf eingeschmuggelte Regeln (main: visible, Ebene 0 bleibt, fremde Ebene, das Geraet mit,
              # Zwilling geweckt) fallen je beim Namen. --selftest zuerst.
              run: npm run gate:ego-schatten

            - name: Ziel-Zensus (echter Renderer — jedes GPU-Ziel hat einen Leser, die Schatten-Karte zeichnet ohne Farbe)
              if: matrix.gruppe == 17
              # Faehrt den ECHTEN Frame (swiftshader, kienspan) n Frames lang durch die Haken des Ziel-Zensus: jede GPU-Textur
              # mit Erzeuger, Schreibern und Lesern je Pass, keine Taeter-Klasse (ohne Leser, teilbar, volle Aufloesung fuer
              # niederfrequente Effekte, Tiefe ohne Leser oder doppelt, 32 bit mit 16-bit-Inhalt). Dazu eine Schatten-Buehne
              # durch die Huelle der Kaskaden (Pass ohne Farb-Anhang, Schatten faellt, keine GPU-Validierung) und je Klasse
              # ein eingeschmuggelter Taeter, der beim Namen rot faellt und danach restlos fort ist. --selftest zuerst.
              run: npm run gate:ziel-zensus

            - name: Verdeckungs-Abfrage (echter Renderer — der Aussteige-Ablauf am Bach, jede WebGPU-Validierung beim Namen)
              if: matrix.gruppe == 15
              # Faehrt am Bach der Mess-Wiese (swiftshader, kienspan, EIN Boot) den echten Spiel-Takt: ein Region-Buendel jenseits
              # des Bachs (der Berg-Cull baut seinen Occlusion-Stellvertreter, Probe jeden queryTakt-ten Frame), der GT am Ufer,
              # Aufsitzen, Fahrt, AUSSTEIGEN (die Sicht zurueck auf first), zwei Probe-Fenster Blick uebers Wasser. Dazu die
              # Stationen Bruch (ein Leser der Szenen-Tiefe bricht den Pass bei offener Abfrage), Gift (ein gezaehlter
              # Stellvertreter mit gescheiterter Pipeline) und Letzter (der Stellvertreter als letzter Draw, der naechste Frame
              # mit Zaehler 0). ROT bei jeder Device-Meldung, jeder Zeile der GPU-Wache und jedem Seitenfehler; zuletzt ohne die
              # Huellen (Vendor-Methoden) muessen „incomplete occlusion query“, „No occlusion queries“, „weak set“ und der
              # Letzte beim Namen fallen.
              run: npm run gate:verdeckungs-abfrage

            - name: Wasser-Bild (echter Renderer — das Wasser-Material und der Regen)
              if: matrix.gruppe == 17
              # Fährt den ECHTEN Renderer (swiftshader, Software-Holz) mit dem echten Wasser-Material auf einem Fluss-Bogen:
              # kein Zebra bei Wasser-Uhr 3600 s gegen 60 s, kein Schaum ohne Gesetz-Grund, der Sturm bewegt das Wasser
              # (Wind-Zeile des Gesetzes); der Sturm-Regen allein auf Schwarz zeigt Schlieren, quer zum Wind geneigt.
              run: npm run gate:wasser-leben:bild

            - name: Look-Golden-Linse (Selbst-Test der perzeptuellen MSSIM-Metrik)
              if: matrix.gruppe == 5
              # Beweist die perzeptuelle Linse SELBST (MSSIM: identisch→1 · degradiert→<1), GPU-frei.
              # Der gerenderte Golden-Vergleich (--render/--mint) gehört auf echte GPU + einen
              # Schöpfer-Sign-off — hier läuft nur der gate-taugliche Linsen-Selbst-Test.
              run: npm run look-golden

            - name: Konsum-Zeuge sammelt (je Wurzel lies · liste · frage · teil · ruft)
              if: ${{ !cancelled() }}
              env:
                  KONSUM_GRUPPE: voll ${{ matrix.gruppe }}
              # die Spur steht auch in Notizen am Job (gzip + base64 in Teilen zu 4 000 Zeichen, der Deckel einer Notiz; über die API
              # lesbar): wo das Artefakt nicht zu holen ist
              run: |
                  node scripts/lib/konsum-zeuge.cjs --sammle "$KONSUM_ZEUGE" --aus "$RUNNER_TEMP/konsum.json"
                  gzip -9c "$RUNNER_TEMP/konsum.json" | base64 -w0 | fold -w 4000 | nl -w1 -s' ' | while read -r i teil; do echo "::notice title=konsum.json.gz.b64 $i::$teil"; done

            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: konsum-voll-${{ matrix.gruppe }}
                  path: ${{ runner.temp }}/konsum.json
                  retention-days: 14

    echt:
        # DIE ECHT-GRUPPE (K65, Entscheid 16.10.): BESTEHENDE Wände der GPU-Klasse ZUSÄTZLICH auf dem eigenen Läufer mit der echten
        # Karte (Label echt-gpu, Läufer radeon-890m; die GTX bleibt dem ABAB) — swiftshader verbirgt, was eine echte GPU anders zeichnet (Lehre 17); je
        # Schritt derselbe Befehl wie in `voll`, dazu die Wände der Karte (gate:…:echt). Ein Schritt, dessen Browser nur den
        # Null-Renderer trägt, zeichnet nie und steht hier nicht (die Weiche nennt ihn ROT). Jeder Schritt fährt auch nach einem
        # roten (`!cancelled()`) und trägt seine Frist (timeout-minutes aus node scripts/ci-zeiten.cjs), der Job höchstens 45 min,
        # sein Plan höchstens 20 min (die Waage). Bei jedem push auf integ-probe und nachts, hinter dem Kopf-Richter (echt=ja: der
        # Kopf trägt noch keine grüne Echt-Gruppe); nie pull_request (das Repo ist öffentlich; der Hook des Läufers lässt nur push
        # von MiguellD durch und wartet auf das GPU-Schloss der Maschine). gate:ci-deckung (E).
        name: echt (GPU-Wände auf der Karte)
        needs: kopf
        if: (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/integ-probe')) && needs.kopf.result == 'success' && needs.kopf.outputs.echt == 'ja'
        runs-on: [self-hosted, echt-gpu]
        timeout-minutes: 45
        permissions:
            contents: read
        env:
            CI_KLASSE: gpu
            LINSE_GPU: karte
        # bash für jeden Schritt: Windows PowerShell fährt auf dem Läufer keine Skript-Dateien (Richtlinie Restricted, Lauf
        # 39935664101), die Standard-Shell eines run-Schritts wäre dort powershell
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, am SHA: der Job läuft auf einem eigenen Rechner

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, am SHA
              with:
                  node-version: "22"

            - name: Dependencies installieren (Echt-Läufer, der puppeteer-Chrome bleibt auf der Platte des Läufers)
              shell: bash
              run: npm ci --no-audit --no-fund




            - name: Fern-Ring auf der Karte (jenseits des Streaming-Rings zeichnet das EINE Höhen-Gesetz)
              timeout-minutes: 14
              if: ${{ !cancelled() }}
              run: npm run gate:fern-ring



            - name: Schatten-Bias auf der Karte (das Gesetz der Kaskade)
              timeout-minutes: 5
              if: ${{ !cancelled() }}
              run: npm run gate:schatten-bias

            - name: Ziel-Zensus auf der Karte (jedes GPU-Ziel hat einen Leser, die Schatten-Karte zeichnet ohne Farbe)
              timeout-minutes: 14
              if: ${{ !cancelled() }}
              run: npm run gate:ziel-zensus


            - name: Nah-Linse auf der Karte (kein Analog-Satz diesseits der Nah-Grenze 64 m)
              timeout-minutes: 8
              if: ${{ !cancelled() }}
              run: npm run gate:analog-nah



            - name: Foundry-Impostor auf der Karte (auf dem EINEN Haupt-Renderer)
              timeout-minutes: 6
              if: ${{ !cancelled() }}
              run: npm run gate:foundry-impostor


            - name: Pruefbuehne S0 auf der Karte (der Feuerkreis aus 2 m traegt Luma >= 0,15 in der Ausgabe)
              timeout-minutes: 12
              if: ${{ !cancelled() }}
              run: npm run gate:pruefbuehne-licht

            - name: Wasser-Bild auf der Karte (das Wasser-Material und der Regen)
              timeout-minutes: 8
              if: ${{ !cancelled() }}
              run: npm run gate:wasser-leben:bild

            - name: Post-Kette auf der Karte (jede Nachbild-Stufe kostet nur, wenn sie zeigt)
              timeout-minutes: 6
              if: ${{ !cancelled() }}
              run: npm run gate:post-kette

            - name: Portal-Membran auf der Karte (die Passage zeichnet nur im Blick)
              timeout-minutes: 15
              if: ${{ !cancelled() }}
              run: npm run gate:portal-membran

            - name: Ego-Schatten auf der Karte (in der Ego-Sicht wirft der Leib seinen Schatten, das Auge sieht ihn nicht)
              timeout-minutes: 5
              if: ${{ !cancelled() }}
              run: npm run gate:ego-schatten

            - name: Verdeckungs-Abfrage auf der Karte (der Aussteige-Ablauf am Bach, jede WebGPU-Validierung beim Namen)
              timeout-minutes: 6
              if: ${{ !cancelled() }}
              run: npm run gate:verdeckungs-abfrage

            - name: Frost-Wand auf der Karte (das Weltbild folgt der Kamera vom Ankommen bis zur Hof-Bühne, nie der Ladeschirm)
              timeout-minutes: 8
              if: ${{ !cancelled() }}
              run: npm run gate:weltbild-frost:echt

            - name: Tag-Achse auf der Karte (die Belichtung folgt dem Licht stetig und gegen es, kein Einbruch, Spawn und Mess-Wiese)
              timeout-minutes: 13
              if: ${{ !cancelled() }}
              # werkbank licht --tag --kurz: Mitternacht, Mittag und die Grobschritte um den Horizont, der Aufgang im Feinschritt
              # 0,002 (SPRUNG gegen den steilsten Feinschritt des Lichts) — lokal 2,5 min samt Boot (Radeon)
              run: npm run gate:tag-achse:echt

            - name: Lichtweg auf der Karte (Feld, Panorama und Wasser zeigen dieselbe Fläche wie die Stoffe, je Uhr 0,9–1,1)
              timeout-minutes: 8
              if: ${{ !cancelled() }}
              # werkbank licht --laub feld…wasser: die graue Fläche im Licht der Welt gegen eine MeshStandard-Karte, waagrecht und
              # senkrecht zur Sonne, neben und von ihr weg — lokal 1 min samt Boot (Radeon). Die Spiegel-Zeilen hängen am Weltzustand
              # (spiegel0 bei Uhr 0,27: frische Welt 0,778, eingeschwungene 0,951) und fahren bis zu ihrer Heilung nur in der Werkbank.
              run: npm run gate:licht-weg:echt

            - name: Naesse auf der Karte (Regen benetzt poroesen Boden 0,5-0,8, innen unter dem Dach +-5 %, dichte Stoffe unveraendert)
              timeout-minutes: 13
              if: ${{ !cancelled() }}
              # werkbank licht --naesse: Mess-Wiese und das naechste Haus im Dorf von innen durch die offene Tuer, klar / Regen frisch /
              # Regen 10 min aus dem Ausgabe-Pfad; der Selbsttest macht die Basis (Naesse 1,0) und eine Naesse ohne Dach rot
              run: npm run gate:naesse:echt

            - name: GPU-Fehler-Linse auf der Karte (jede WebGPU-Validierung beim Namen)
              timeout-minutes: 8
              if: ${{ !cancelled() }}
              run: npm run gate:gpu-fehler
