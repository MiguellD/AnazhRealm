            - name: Mehrspieler-Wand (zwei Seiten, echter signaling-server - Tuer, Knopf, Boot, kein Mitspieler im Ursprung)
              if: steps.vorbereitung.outcome == 'success' && !cancelled() && matrix.gruppe == 13
              # K04: der nackte Aufruf heilt nach Server-Ausfall (Rejoin), der Knopf liest die EINE Absicht, der Mitspieler
              # erscheint erst an seinem Ort; der Selbsttest setzt die alte Tuer ein und sieht (b) ROT. K23 (c): das Chat-Graben
              # kommt bei B GENAU einmal an (jeder Edit von A, und B traegt keinen mehr); im Hauptlauf wendet B danach jede
              # Graben-Nachricht doppelt an und (c) muss ROT werden (die erste Fassung, ohne die Laenge, blieb gruen).
              # K60 (d): der Ghost bei B verbraucht erst je 20 angekommene Schritte (lange Takte in Schritten, nie in ms), und
              # jeder Takt haelt das Gesetz von _lockstepTickPeers: Verbrauch bis zur Kappe der Wanduhr ceil(10 x dt/FIXED_DT)
              # oder bis zur Reserve (taktBruch); der Schub vor dem Fenster haelt es, die alte Kappe je Frame muss am Gesetz ROT werden.
              run: npm run gate:mp-sync

            - name: Die V1-Pfad-Linse (Welle L - Vorschau, Ankunft, Eingabe, Wort, KI-Fehler)
              if: steps.vorbereitung.outcome == 'success' && !cancelled() && matrix.gruppe == 12
              # Die Defekte der Leben-Pruefung auf dem gespielten v1.0-Pfad, je beim Namen: jede Probe ruft den
              # Chokepoint selbst im echten Boot (headless, foundry-ON) und misst seine Wirkung; der Selbsttest
              # bricht jede Stelle einzeln. WORT: der KI-Korpus (40 Saetze) mit dem Mitschnitt des echten Modells ueber den
              # echten Chat-Pfad - der echte Lauf (--korpus --echt, lokales ollama) ist nicht CI-Pflicht.
              run: npm run gate:v1-pfad

            - name: Die Werkstatt-Weg-Linse (Welle L Folge - v1-Schritte 3 und 4, Werkstatt bauen und KI erschaffen)
              if: steps.vorbereitung.outcome == 'success' && !cancelled() && matrix.gruppe == 16
              # Die Defekte der sichtbaren Leben-Schau 07.10. auf dem Weg Satz/Werkstatt -> stehendes Werk, je beim Namen,
              # im echten Boot (headless, foundry-ON); L-WERKSTATT faehrt echte Eingaben (Tasten, Klicks, Rad) und zaehlt sie
              # am Ereignis-Strom (<= 3 bis zum stehenden Werk); der Selbsttest bricht Verdikte und Wand je einzeln.
              run: npm run gate:werkstatt-weg

            - name: Die Kamera-Laub-Linse (K06 - Laub, Strauch und Fels vor der Linse, die Nah-Kugel der Durchsicht)
              if: steps.vorbereitung.outcome == 'success' && !cancelled() && matrix.gruppe == 16
              # An vier Orten der Leben-Schau 2 je Pflanze acht Stellungen zu Fuß, im Ritt und im Ich-Auge: die Nah-Deckung
              # des Schirms je Täter-Klasse (scripts/lib/kamera-nah.cjs); der eingeschmuggelte Laub-Stoff und Fels müssen beim
              # Namen fallen, der Selbsttest nennt jeden Bruch und die statische Wand feuert am Vor-Stand.
              run: npm run gate:kamera-laub

            - name: Die Ankunfts-Linse (Welle L Folge - Ladeschirm, Fadenkreuz, Hilfe, Chat-Taste, Start-Gurt, Kamera im Baum, Dorf vor dir)
              if: steps.vorbereitung.outcome == 'success' && !cancelled() && matrix.gruppe == 10
              # Die Defekte der sichtbaren Leben-Schau 07.10. auf den v1-Schritten 1-2, je beim Namen: jede Probe ruft den
              # Chokepoint selbst im echten Boot (headless, foundry-ON); der Selbsttest nennt jeden Befund-Zustand und
              # die statische Wand feuert am Vor-Stand.
              run: npm run gate:ankunft

            - name: Wasser-Wand (Welle L — Q6 + Q7, die Proben rufen die Chokepoints selbst)
              if: steps.vorbereitung.outcome == 'success' && !cancelled() && matrix.gruppe == 10
              # Null-Renderer an der Mess-Wiese (Sync-Bau, Worker ausgehängt): der Fluss-Spiegel stromab nie steigend,
              # quer waagrecht, die Quelle ein Rinnsal, die Bank nie steiler als der Fels, Kanal Main = Worker; der
              # Körper nach seiner Gestalt im Wasser (Hineingehen, Brustkorb-Linie, Kraulen, Eintauchen, Tier, Mitspieler,
              # Licht, Medium), die Decke über trockenen Höhlen, der Wagen watet und das Boot treibt, keine Ufer-Flut,
              # Klang · Tier-Scheu · Küsten-Sheet lesen die EINE Wahrheit, die Ufer-Bänder stetig über die Krone. --selftest
              # zuerst. K61: die Quell-Probe (die 12 Kacheln QUELL_KACHELN, 328 Quellen, 87 % der Wand) fährt in drei
              # Seiten nebeneinander (WASSER_QUELL_TEILE), jede Seite stellt die Kacheln selbst her, das Ganze urteilt
              # über dieselben Quellen (F5 KACHELN: eine fehlende Kachel ist rot).
              run: npm run gate:wasser-leben

            - name: Werk im Wasser (Schau-2 — der Hain am Fluss, das Dorf am Ufer, der Wagen in der Furt, der Damm im Reload)
              if: steps.vorbereitung.outcome == 'success' && !cancelled() && matrix.gruppe == 18
              # Der Schau-Ablauf am Fluss −872/−1127 im echten Spiel-Takt (Bau-Eiche, „pflanz mir einen eichenhain am
              # wasser", 1200 Takte): kein Stamm unter dem gezeichneten Wasser, der Wasser-Automat schläft; jedes gesetzte
              # Werk (Wald, Hain, Dorf mit Fundament) vor seinem Stempel gegen Bild UND Gesetz des Wassers; der GT in einer
              # Furt bremst (1 s nach dem Eintauchen ≤ 50 %), die Kamera nie unter dem Spiegel; die Leser der EINEN
              # Wasser-Wahrheit statisch; der Wasser-Term des Kerns (ohne Tiefe byte-gleich, die EINE Masse des Wagens).
              # D: ein Damm quer über den Fluss in einer frischen Welt, 1200 Takte, gespeichert, neu geladen — der Stausee
              # bildet sich neu (nasse Punkte ± 10 % des Staus), sein Abbau weckt den Automaten. R: das Nexus-Dorf am Seerand
              # weckt den Automaten nicht, das Wasser bleibt (± 1 %). E: jeder Setz-Op mit erzwungenem Fehl-Grund sagt die
              # tatsächliche Zahl und den Grund. A (Karte K02, FZ-01): der GT fährt mit Vollgas die Rampe der Furt hinab —
              # 3 s nach der Ansaugung ≤ 0,5 m/s, kein Vortrieb, nie über das Dach im Wasser; der Ausstieg an Land steht
              # neben dem Wagen, im See (≥ 1,35 m) schwimmt er; K6: der Wasserschlag sperrt die Räder am Hang.
              # --selftest zuerst. ~3 min.
              run: npm run gate:werk-im-wasser

            - name: Studio-Blick (Selbsttest — ein uniformes Bild ist ein blinder Blick)
              if: steps.vorbereitung.outcome == 'success' && !cancelled() && matrix.gruppe == 15
              # GPU-frei: das Urteil des Blicks (scripts/diag-blick.cjs, die Welt und jedes Studio) an gepflanzten Bildern;
              # der Schuss selbst (npm run blick:studio -- garage --paar) läuft im Agenten, nie in der Batterie.
              run: npm run gate:studio-blick

            - name: Mensch-Anatomie (Welle 5 — Hand, Arm, Kopf, Gesicht, Fuß gegen die Anthropometrie)
              if: steps.vorbereitung.outcome == 'success' && !cancelled() && matrix.gruppe == 17
              # GPU-frei, reines Node (three r128 im vm): das Gesetz bauMensch + morphAuf mit den Start-Dials, die Arme
              # gerade, normiert auf die Körperhöhe — Hand-Länge/-Breite, Handgelenk, Unterarm/Oberarm, Kopf-Höhe/-Breite,
              # Pupillen-Abstand, Augapfel, Iris, Mund, Fuß gegen koerper-core MENSCH_SOLL. --selftest zuerst: 1,5-fache
              # Hand, doppelte Augäpfel, doppelter Pupillen-Abstand → rot.
              run: npm run gate:mensch-anatomie

            # DAS URTEIL DER GRUPPE: dieselbe Form wie im Puls (der Anker &urteil dort), gate:ci-deckung (U) URTEIL
            - *urteil

    echt:
        # DIE KARTEN (K65, Entscheid 16.10.; w27-swift-raus, 10.11., der Schöpfer: „wieso noch die Übersetzung? … geprüft am System,
        # wo's zählt"): JEDE Wand der GPU-Klasse fährt NUR hier, auf den eigenen Läufern mit der echten Karte — swiftshader verbirgt,
        # was eine echte GPU anders zeichnet (Lehre 17), und eine zweite Fassung derselben Wand auf GitHub-ubuntu war ein Zwilling
        # (z358–z366: jedes ihrer ROT der 900-s-Abriss an createRenderPipelineAsync, kein Täter). DREI BEINE ZUGLEICH, je Karte
        # eines (matrix.karte = der Name des Läufers bis zum ersten Bindestrich, sein Label <karte>-gpu; gpu-probe.yml gibt demselben
        # Label Vorfahrt): omen (GTX 1060), radeon (890M) und gtx1050 (GTX 1050 mit i7-950: nur Wände ohne Zeit-Urteil — sein
        # Haupt-Faden liegt 3- bis 8-mal über jedem Budget; eine Wand mit Zeit-Urteil steht auf einem Band-Gerät, omen oder radeon).
        # Jeder Schritt steht in GENAU einem Bein (`matrix.karte == '<karte>'`), fährt auch nach einem roten (`!cancelled()`) und
        # trägt seine Frist (timeout-minutes aus node scripts/ci-zeiten.cjs); der Job höchstens 45 min, der Plan je Bein höchstens
        # 20 min (die Waage). Ein Schritt, dessen Browser nur den Null-Renderer trägt, zeichnet nie und steht hier nicht (die Weiche
        # nennt ihn ROT, gate:ci-deckung (K) statisch). Der Start-Hook jedes Läufers nimmt das GPU-Schloss der Maschine (dasselbe wie
        # für jede GPU-Probe, die ihm nachgibt) und lässt nur push und schedule von MiguellD durch; nie pull_request (das Repo ist
        # öffentlich). Bei jedem push auf integ-probe, zug-a und zug-b (die Hälften der Bisektion, zug.cjs teile) und nachts, hinter
        # dem Kopf-Richter (echt=ja: der Kopf trägt noch nicht jedes Bein grün). gate:ci-deckung (E).
        name: echt ${{ matrix.karte }} (GPU-Wände auf der Karte)
        needs: kopf
        if: (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/integ-probe' || github.ref == 'refs/heads/zug-a' || github.ref == 'refs/heads/zug-b'))) && needs.kopf.result == 'success' && needs.kopf.outputs.echt == 'ja'
        strategy:
            fail-fast: false
            matrix:
                karte: [omen, radeon, gtx1050]
        runs-on: [self-hosted, "${{ matrix.karte }}-gpu"]
        timeout-minutes: 45
        permissions:
            contents: read
        env:
            CI_KLASSE: gpu
            LINSE_GPU: karte
        # bash für jeden Schritt: Windows PowerShell fährt auf dem Läufer keine Skript-Dateien (Richtlinie Restricted, Lauf
        # 39935664101), die Standard-Shell eines run-Schritts wäre dort powershell
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, am SHA: der Job läuft auf einem eigenen Rechner

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, am SHA
              with:
                  node-version: "22"

            - name: Dependencies installieren (Echt-Läufer, der puppeteer-Chrome bleibt auf der Platte des Läufers)
              shell: bash
              run: npm ci --no-audit --no-fund

            # ── DAS BEIN OMEN ──
            - name: Fern-Ring auf der Karte (jenseits des Streaming-Rings zeichnet das EINE Höhen-Gesetz)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:fern-ring

            - name: Schatten-Bias auf der Karte (das Gesetz der Kaskade)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              # die Quell-Wand am Stamm: normalBias und den Tiefen-Bias einer Schatten-Karte schreibt nur das Gesetz (`_schattenBias`, EINE
              # Quelle atmosphere.shadowBias); der Selbsttest macht einen festen Meter-Wert, einen leeren Schatten und Akne rot
              run: npm run gate:schatten-bias

            - name: Ziel-Zensus auf der Karte (jedes GPU-Ziel hat einen Leser, die Schatten-Karte zeichnet ohne Farbe)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:ziel-zensus

            - name: Nah-Linse auf der Karte (kein Analog-Satz diesseits der Nah-Grenze 64 m)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:analog-nah

            - name: Foundry-Impostor auf der Karte (auf dem EINEN Haupt-Renderer)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:foundry-impostor

            - name: Pruefbuehne S0 auf der Karte (der Feuerkreis aus 2 m traegt Luma >= 0,15 in der Ausgabe)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:pruefbuehne-licht

            - name: Wasser-Bild auf der Karte (das Wasser-Material und der Regen)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:wasser-leben:bild

            - name: Post-Kette auf der Karte (jede Nachbild-Stufe kostet nur, wenn sie zeigt)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:post-kette

            - name: Portal-Membran auf der Karte (die Passage zeichnet nur im Blick)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:portal-membran

            - name: Ego-Schatten auf der Karte (in der Ego-Sicht wirft der Leib seinen Schatten, das Auge sieht ihn nicht)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:ego-schatten

            - name: Kamera-Leib auf der Karte (K6 - am Pruefplatz wird der Leib beim Seitwaertsgehen nie durchsichtig)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              # Third am Pruefplatz, Strafe A/D im Takt des Spiels: je Probe das Bild des Spiels gegen dieselbe Pose stehend und ohne
              # Leib (Kopf und Leib, wie viel Grund durch ihn scheint); der Schmuggel ohne getragenen Leib (das Bewegungsfeld der
              # Kamera allein) muss Bilder nennen. Braucht die zeitliche Aufloesung (das Holz der Karte), lokal 46 s samt Boot (Radeon).
              run: npm run gate:kamera-leib:echt

            - name: Verdeckungs-Abfrage auf der Karte (der Aussteige-Ablauf am Bach, jede WebGPU-Validierung beim Namen)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:verdeckungs-abfrage

            - name: Frost-Wand auf der Karte (das Weltbild folgt der Kamera vom Ankommen bis zur Hof-Bühne, nie der Ladeschirm)
              timeout-minutes: 8
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              # der SPIELPFAD (Ankunft · dritte Person · Werkstatt · Tab · Hof) am selben Pruefer wie die Probe-Buehne: Index-Zensus, keine
              # WebGPU-Validierung, die Wachen schweigen, das Bild folgt der Kamera, die Entsorgung der Buehnen (S1–S6), die Taeter T1–T3
              run: npm run gate:weltbild-frost:echt

            - name: Tag-Achse auf der Karte (die Belichtung folgt dem Licht stetig und gegen es, kein Einbruch, Spawn und Mess-Wiese)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              # werkbank licht --tag --kurz: Mitternacht, Mittag und die Grobschritte um den Horizont, der Aufgang im Feinschritt
              # 0,002 (SPRUNG gegen den steilsten Feinschritt des Lichts) — lokal 2,5 min samt Boot (Radeon)
              run: npm run gate:tag-achse:echt

            - name: Lichtweg auf der Karte (Feld, Panorama und Wasser zeigen dieselbe Fläche wie die Stoffe, je Uhr 0,9–1,1)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              # werkbank licht --laub feld…wasser: die graue Fläche im Licht der Welt gegen eine MeshStandard-Karte, waagrecht und
              # senkrecht zur Sonne, neben und von ihr weg — lokal 1 min samt Boot (Radeon). Die Spiegel-Zeilen hängen am Weltzustand
              # (spiegel0 bei Uhr 0,27: frische Welt 0,778, eingeschwungene 0,951) und fahren bis zu ihrer Heilung nur in der Werkbank.
              run: npm run gate:licht-weg:echt

            - name: Naesse auf der Karte (Regen benetzt poroesen Boden 0,5-0,8, innen unter dem Dach +-5 %, dichte Stoffe unveraendert)
              timeout-minutes: 8
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              # werkbank licht --naesse: Mess-Wiese und das naechste Haus im Dorf von innen durch die offene Tuer, klar / Regen frisch /
              # Regen 10 min aus dem Ausgabe-Pfad; der Selbsttest macht die Basis (Naesse 1,0) und eine Naesse ohne Dach rot
              run: npm run gate:naesse:echt

            - name: GPU-Fehler-Linse auf der Karte (jede WebGPU-Validierung beim Namen)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              run: npm run gate:gpu-fehler

            - name: Kamera-Treue und Stand-Wand auf der Karte (der Replay zeichnet wie der direkte Pfad, im Stand arbeitet die Diät nichts doppelt)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'omen' }}
              # eine eigene Buehne mit Schatten: die Aufnahme verfolgt jeden Draw, der Replay zeichnet wie der direkte Pfad; die STAND-WAND:
              # im Stand je Render kein Voll-Refresh, kein Upload, kein zweiter Gang; VERSCHACHTELT ueberlebt kein Stempel; --selftest zuerst
              run: npm run gate:kamera-treue

            # ── DAS BEIN RADEON ──
            - name: Die Kamera-Leib-Linse auf der Karte (K06 - WE-05, FZ-07, NP-03 - nie im Fels, nie unter dem sichtbaren Boden, nie in einer Box)
              timeout-minutes: 9
              if: ${{ !cancelled() && matrix.karte == 'radeon' }}
              # 50 feste Posen (40 Mess-Wiese, 10 Pruefbuehne s2-hang30) zu Fuss und im Verfolger-Ritt gegen die exakte Gestalt, die
              # Feld-Proben je 3rd-Bild, die Spruenge im Rundgang; NP-03 48 Posen im Koerper-Studio, NP-02 der Tunnel. K4 der Gang (leib.K4):
              # Third zu Fuss im echten Takt an Stamm, Fels und Haus (rueckwaerts heran, 360°-Orbit) — die Kugel der Linse nie in Fels oder
              # Bau, keine Nah-Pixel, Ruck p95 ≤ 0,02 m; der Arm ohne Kollision ist ROT. Auf swiftshader trug sie 318–898 s je Laeufer.
              run: npm run gate:kamera-leib

            - name: Erst-Zeichnungs-Wand Teil 1 auf der Karte (Boot-Konsum, drei neue Stoffe ohne synchrone Pipeline, Neubau, Bundle-Neubau)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'radeon' }}
              # DIE ERST-ZEICHNUNGS-WAND (Welle K, die Haenger-Klasse): eine erste Zeichnung baut ihren Stoff im Pass und laesst ihre
              # Pipeline asynchron entstehen; ein Objekt, das schon zeichnete, baut einen Neubau im Frame und blinkt nie aus — der
              # Gegen-Lauf auf dem Vendor-Weg MUSS rot sein, ohne Gedaechtnis MUSS der Neubau blinken, ein Bundle-Buerger steht ≤ 2 Frames
              # nach seiner fertigen Pipeline wieder in der Aufnahme. Zwei Teile in zwei Welten, jedes Band in GENAU einem Teil
              # (`npm run gate:hitch-telemetrie` faehrt beide); kein Bau ueber dem Deckel seines Aufrufs (ms): ein Band-Geraet.
              run: node scripts/diag-hitch-telemetrie.cjs --teil=1

            - name: Erst-Zeichnungs-Wand Teil 2 auf der Karte (Bundle ohne Anmeldung, hängender Fehler-Scope, Beweis-Aufnahme, Absage)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'radeon' }}
              run: node scripts/diag-hitch-telemetrie.cjs --teil=2

            - name: Takt-Atem auf der Karte (der atmende Regler weckt keinen Fege-Takt und keine Pass-Lage)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'radeon' }}
              # die echte Welt ohne Loop und ohne Wanduhr: der Aktuator steht auf festen Stufen (loadScale 1 -> 0,1 -> 1, je 80 Takte) und
              # atmet darueber; gezaehlt je Takt die Wechsel der Laub-Dichte, die Weckrufe des Stand-Stempels, die neuen Lagen des Hauptbilds
              run: npm run gate:takt-atem

            - name: Die Labor-Linse der Garage auf der Karte (Welle L — Maus, HUD, Tacho, Preset, Kultur)
              timeout-minutes: 8
              if: ${{ !cancelled() && matrix.karte == 'radeon' }}
              # die Probefahrt-Werkstatt, wie der Schoepfer sie bedient: Orbit-Zug und Umsehen ohne Seitenfehler, der Fahr-HUD als Flex-Band,
              # der Tacho in km/h, Preset und Kultur ohne Leck, die Ansicht je Modus (≥ 1,5 % Wagen in ≤ 120 Befehlen), G10 Leicht gegen Voll
              # an der Bildzeit der Leinwand (ein Zeit-Urteil: ein Band-Geraet)
              run: npm run gate:garage-labor

            - name: Das Studio-Dorf begehen auf der Karte (Welle L — Hülle je Haus, Treppe, Keller-Decke, Fluss, Antike)
              timeout-minutes: 8
              if: ${{ !cancelled() && matrix.karte == 'radeon' }}
              # das Fachwerk-Labor im Browser: die Probe ruft die echten Lab-Pfade (buildDorf · promoteB · demoteB · walkUpdate · Raycaster),
              # B1–B6 und je Defekt die Basis-Zeile des Servers (--selftest) → genau ihre Probe rot
              run: npm run gate:studio-begehen

            - name: Portal-Konformanz auf der Karte (W1 c/e — die Heimat richtet jede Welt — Handshake endlich, Quelle geprüft, DSL wirkt, Esc heim)
              timeout-minutes: 10
              if: ${{ !cancelled() && matrix.karte == 'radeon' }}
              # die echte Heimat betritt alle 13 Welten ueber den echten Weg: K1 ready · K2 der Handshake endet · K3 keine fremde Seite steuert
              # · K4 die chain-Form wirkt sichtbar (die Probefahrt der Garage, das bewegte Bild der Strom-Welt) · K5 Esc heim · K6 keine
              # Seiten-Fehler · K7 die Welt zeigt das Mitgebrachte · K8 was der Spieler traegt, steht byte-gleich; --selftest zuerst
              run: npm run gate:portal-konformanz

            - name: GPU-Churn-Linse auf der Karte (die Klasse hinter dem V18.322-Idle-Freeze)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'radeon' }}
              # nach dem Warmup MUSS eine Env-Regenerierung 0 Pipelines neu kompilieren (createRenderPipeline/linkProgram gezaehlt)
              run: npm run gpu-lens

            # ── DAS BEIN GTX1050 ──
            - name: Schatten am Terminator auf der Karte (1110-5 - die Hang-Akne, die Zuwendung der wahren Normale)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'gtx1050' }}
              # die Werkbank im vollen Holz am Hang: die Akne am Terminator gegen die Zuwendung der wahren Normale (bis w27-swift-raus fuhr
              # die Wand in einer CPU-Gruppe still auf swiftshader — die Werkbank startet ihre Welt an der Weiche vorbei)
              run: npm run gate:schatten-terminator

            - name: Fenster-Wand auf der Karte (ein Fenster-Wechsel macht die Welt nie wieder schwarz)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'gtx1050' }}
              # der ECHTE Frame mit LAUFENDEM Loop am Bach der Mess-Wiese: vergroessern, DPR 2, zurueck, die Pixel-Ratio allein — je Schritt
              # keine WebGPU-Validierung, gezaehlt in gerenderten Frames; ohne den Vorher-Textur-Waechter faellt der Pixel-Ratio-Schritt beim
              # Namen. Auf swiftshader-Linux riss sie seit z330 in 26 von 43 Jobs nach 900 s im Pipeline-Bau VOR dem ersten Fenster-Wechsel
              # (Laeufer-Zeit statt Verhalten), nie an einem Schritt der Wand; auf der Karte am Ufer nach 12 s, die Wand samt Taeter 20 s.
              run: npm run gate:fenster-wechsel

            - name: Volle-Bühne-Prädikat auf der Karte (W2 — Kriterium 2 wird messbar)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'gtx1050' }}
              # „Volle Buehne" als Praedikat aus kanonischen Quellen (Ring am Ziel · Gras/Wasser leer · die Streu steht · Bibliothek warm ·
              # Impostoren idle · Nebel offen); der Selbsttest macht die wartende Spieler-Region und die fehlende Regionen-Karte rot
              run: npm run gate:boot-stage

            - name: Die Albedo-Tafel auf der Karte (S1 W1e - je Klasse Labor-Albedo, Welt-Albedo und ihr Verhaeltnis als Ratsche)
              timeout-minutes: 6
              if: ${{ !cancelled() && matrix.karte == 'gtx1050' }}
              # die acht Klassen des Studio-Befunds je Zeile Labor-Y, Welt-Y und das Verhaeltnis (spec/farbe/albedo-tafel.json, geeicht an
              # der 18-%-Karte); |ln Verhaeltnis| ist die Ratsche; eine veraltete Zeile bricht und nennt ihren fremden Quell-Abdruck
              run: npm run gate:albedo-tafel

            - name: Die Albedo nah gegen fern auf der Karte (0910-8 — EINE Boden-Farbe je Ort, die weisse Masse)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'gtx1050' }}
              # die Werkbank an der Mess-Wiese: je Ort im Chunk-Quadrat der Boden-Satz und der Fern-Ring orthogonal aus 420 m ueber 132 m,
              # beide Leser gegen das Gesetz an der Stelle (`_fernRingTeile`) — bis w27-swift-raus fuhr sie in einer CPU-Gruppe still auf
              # swiftshader (die Werkbank startet ihre Welt an der Weiche vorbei)
              run: npm run gate:nah-fern

            - name: Tier-Gang ohne Gleiten auf der Karte (Welle 5 — das Gang-Gesetz am echten Chokepoint)
              timeout-minutes: 8
              if: ${{ !cancelled() && matrix.karte == 'gtx1050' }}
              # jede Gattung bei 0,8 · 1,6 · 3,0 m/s durch _animateCompoundMotion, der Aufsetz-Punkt jeder Pfote im Stand (Schlupf ≤ 0,05),
              # derselbe Punkt am Spieler-Leib, das Koerper-Studio (Schlupf, Becken-Hub) und die Schwere; --selftest zuerst
              run: npm run gate:tier-gang

            - name: WebGL2-Rückfall auf der Karte (ohne WebGPU-Adapter bootet die Welt laut benannt auf GL und lebt)
              timeout-minutes: 5
              if: ${{ !cancelled() && matrix.karte == 'gtx1050' }}
              # GL am Treiber (__anazhForceWebGL, der EINE Hook): W1 der Backend ist WebGL, W2 der Rueckfall wird einmal laut benannt, W3
              # Feld-Pass und Region-Bundles ruhen, W4 der Fern-Ring verfeinert auf CPU, W5 jedes Programm linkt, W6 ≤ 16 Sampler je Stoff
              run: npm run gate:webgl-probe
