name: Code-Check

# DIE CI IN ZWEI STUFEN (K14, 11.10.; der Schöpfer: „der war früher unter 2 min, das wäre wieder genial").
# Merge-Regel (entscheidung.md §2.8): jeder Karten-Kopf braucht den Puls grün, eine Karte mit Risiko R2/R3 trägt am letzten Push `[ci voll]` und braucht die volle Batterie grün, und eine Karte mit R0/R1 merget auf den Puls, während die volle Batterie auf integ-probe je Merge richtet.
# PULS (Job `puls`, je Push auf jedem Zweig, Wanduhr ≤ 2 min): Format (in Teilen auf allen Kernen), Lint, Syntax, die
# Statik (`npm run check`), der Schnell-Playtest und die Byte-Verträge unter 30 s — zwei Gruppen parallel. VOLL (Job
# `voll`, die ganze übrige Batterie): auf integ-probe und main, auf einem PR nach main, nachts, auf Abruf und bei
# `[ci voll]` in der Commit-Message; die Gruppen nach dem p90 ihrer Schritte verteilt (spec/ci/ci-zeiten.json,
# `node scripts/ci-zeiten.cjs` misst und verteilt, K61 je Klasse cpu/gpu), jede ≤ dem Mittel ihrer Klasse + 0,5 min, hinter dem
# Kopf-Richter (Job `kopf`: ein Kopf, der die volle Batterie schon grün trug, fährt sie nicht noch einmal; auf einem Zweig fahren
# nur die Gruppen, deren Schritte nach Konsum fahren — der Konsum-Zeuge legt je Gruppe die Spur ab, scripts/ci-kopf.cjs `waehle`
# vergleicht sie mit den Wechseln seit dem Grund). `[skip ci]` (WIP)
# überspringt beides. gate:ci-deckung hält die Waage: jeder Schritt steht an GENAU einer Stelle, keine Gruppe über ihrem
# Deckel, kein Schritt ohne Zeit, ein voller Lauf nie mehr Jobs zugleich als das Konto Läufer-Plätze hat.
on:
    push:
        # ohne claude/**: jede Cloud-Sitzung pusht ihren Arbeitszweig claude/<name> mit DEMSELBEN SHA wie den benannten Karten-
        # Zweig — die Gruppe unten ist je Ref, also lief jede volle Batterie doppelt (28.10.: 3 von 20 Läufen in der Schlange,
        # der Zug-Kandidat wartete > 1 h). Der Einlass (fahre.sh) liest den Lauf am SHA, der benannte Zweig trägt ihn.
        branches: ["**", "!claude/**"]
    pull_request:
        branches: [main]
    schedule:
        # nachts 02:30 UTC auf main — die Batterie nur, wenn der Kopf noch kein grünes Urteil trägt (Job `kopf`)
        - cron: "30 2 * * *"
    workflow_dispatch:

# V7 — ein Lauf pro Ref: ein neuer Push auf denselben Branch canceled den laufenden
# (spart Runner-Minuten, kein veralteter Lauf hängt). Der pull_request-Trigger teilt sich
# die Gruppe mit dem push, sodass ein PR-Branch nicht doppelt läuft.
concurrency:
    group: check-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# DIE GRUPPEN DER VOLLEN BATTERIE und ihre Klasse (K61): gpu braucht einen Echt-Renderer (Rezept linse · webgl · echt an der Weiche
# scripts/lib/welt-boot.cjs), cpu nie — die Weiche meldet ein Echt-Rezept in einer CPU-Gruppe ROT (CI_KLASSE), gate:ci-deckung (K)
# hält die Trennung statisch (scripts/ci-zeiten.cjs). `node scripts/ci-zeiten.cjs` schreibt die Tafel; der Kopf-Richter reicht sie an
# voll — ganz auf integ-probe, main, nachts, auf Abruf und am PR, auf einem Zweig nur die Gruppen, deren Schritte nach Konsum fahren.
# Vorbereitet für einen eigenen GPU-Läufer (die GPU-Gruppen), noch nicht eingeschaltet: alle Gruppen laufen auf ubuntu-latest.
env:
    VOLL_GRUPPEN: "1:cpu 2:cpu 3:cpu 4:cpu 5:cpu 6:cpu 7:cpu 8:cpu 9:cpu 10:cpu 11:cpu 12:cpu 13:cpu 14:gpu 15:gpu 16:gpu 17:gpu 18:gpu"

jobs:
    puls:
        # DER PULS — je Push auf jedem Zweig, die Wanduhr ≤ 2 min (vorher lief jeder Push die ganze Batterie: ~25 min, die
        # längste Gruppe trug 26,0 min Median). Zwei Gruppen parallel, jede fährt die Vorbereitung (checkout, setup-node,
        # System-Libs, npm ci) und ihre Schritte (`if: matrix.gruppe`); die Waage (gate:ci-deckung) hält jede ≤ 2 min
        # Median samt Vorbereitung. Was den Puls über 2 min triebe, steht in voll — nie still gestrichen.
        name: puls ${{ matrix.gruppe }}/2
        strategy:
            fail-fast: false
            matrix:
                gruppe: [1, 2]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              # Die Wachstums-Wand (gate:betriebsgesetz in der Statik) misst je Zweig ab der Merge-Basis mit dem Mutter-Zweig:
              # die ganze Geschichte ohne Blobs (Commits + Bäume ~7 MB), die Blobs der geänderten Dateien holt `git diff` in
              # einem Zug nach. Ohne Geschichte ist die Wand ROT (Grund nicht auflösbar), nie still grün.
              with:
                  fetch-depth: 0
                  filter: blob:none

            # V7 — Node 22 (Node 20 ist EOL seit 30.04.2026; der breite `node --check`-Loop
            # brach unter 20 an den eingecheckten ESM-Vendor-Dateien = „lokal grün, CI rot").
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            # K61 — die Caches tragen ihren Inhalt als Schlüssel, nie die Projektversion: der npm-Cache die Abhängigkeiten
            # des Lockfiles, der puppeteer-Chrome die Version von puppeteer-core (scripts/ci-schluessel.cjs). Vorher hingen
            # beide am Hash von package-lock.json (setup-node `cache: npm` und `hashFiles`), jede Versions-Stufe gab einen
            # neuen Schlüssel ohne restore-keys, und der erste Lauf auf integ-probe und main lud den Chrome in jedem Job neu
            # (38629080926 „npm cache is not found"; am 14.10. riss der Download mit ECONNRESET eine ganze Gruppe, 38588243782).
            - name: Cache-Schlüssel
              id: schluessel
              run: node scripts/ci-schluessel.cjs

            - uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ steps.schluessel.outputs.npm }}
                  restore-keys: npm-${{ runner.os }}-

            - uses: actions/cache@v4
              with:
                  path: ~/.cache/puppeteer
                  key: puppeteer-${{ runner.os }}-${{ steps.schluessel.outputs.chrome }}
                  restore-keys: puppeteer-${{ runner.os }}-

            # Die Statik (`npm run check`) bootet in gate:taille einmal Chromium (puppeteer) gegen den eigenen save-server.
            - name: System-Libs für headless Chromium
              # K61: nur was fehlt — das Läufer-Bild trägt die Bibliotheken mit seinem Chrome, apt-get update kostete je Job ~9 s
              run: |
                  LIBS="libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2"
                  # gefragt wird nach den Bibliotheken selbst (24.04 benennt die Pakete mit t64 um, dpkg -s fand sie nie: 38628488866)
                  SO="libnss3.so libatk-1.0.so.0 libatk-bridge-2.0.so.0 libcups.so.2 libdrm.so.2 libxkbcommon.so.0 libXcomposite.so.1 libXdamage.so.1 libXfixes.so.3 libXrandr.so.2 libgbm.so.1 libpango-1.0.so.0 libcairo.so.2 libasound.so.2"
                  DA=1; for so in $SO; do ldconfig -p | grep -qF "$so (" || DA=0; done
                  if [ "$DA" = 1 ]; then
                    echo "System-Libs da"
                  else
                    sudo apt-get update -qq
                    sudo apt-get install -y --no-install-recommends $LIBS libasound2t64 || \
                    sudo apt-get install -y --no-install-recommends $LIBS libasound2
                  fi

            - name: Dependencies installieren
              run: npm ci --no-audit --no-fund

            - name: Prettier-Format-Check
              if: matrix.gruppe == 2
              run: npm run format:check

            - name: ESLint
              if: matrix.gruppe == 2
              run: npm run lint

            - name: Syntax-Check JS-Dateien
              if: matrix.gruppe == 2
              run: |
                  set -e
                  for f in $(git ls-files '*.js'); do
                    echo "→ $f"
                    node --check "$f"
                  done

            - name: Statik (npm run check:statik — Atlas, Source-Probes, Verfassung, Studio-Vertrag, Altlasten, Band-Wand, Selbsttests, Apparat, Vendor-Anker, Betriebsgesetz, CI-Deckung, Taille)
              if: matrix.gruppe == 1
              # `npm run check` = `check:statik` + `gate:haus-fern` (V18.543): die ganze Statik trug je Push Median 105 s und
              # samt Vorbereitung 2,05 min über dem Puls-Deckel 2 min - der Haus-Fernkörper (CI 36-45 s) läuft in Puls 2.
              # Die EINE Statik, dieselbe wie lokal: bis 09.10. stand `npm run check` in keinem Workflow — die Norm-Wände
              # (Verfassung, Studio-Vertrag, Altlasten, Apparat, Vendor-Anker, Betriebsgesetz, Taille, Start-Rezept …)
              # waren Wachsamkeit. Darin: die Stale-Source-Probe-Linse (Refactor-Drift in den Gate-Proben, c1c1271-Klasse),
              # die Band-Wand (Haushalt des Profi-Bands, Ratsche, Textur-Namen, Täter-Klasse — gemessen wird mit
              # `werkbank band` an der echten GPU), das Wasser-Urteil (jeder Täter der Wasser-Wand fällt beim Namen rot)
              # und die CI-Deckung: jeder Gate-Schritt trägt genau EINE Gruppe, und in der Gegenrichtung läuft jedes
              # `gate:*` und jeder Teil dieser Statik in einem Workflow — oder steht mit Klasse und Grund in der
              # Ausnahme-Liste von scripts/diag-ci-deckung.cjs. gate:taille startet den save-server selbst (TAILLE_PORT,
              # sonst ein freier Port des Systems, welt-boot `eigenePorte`) und liest ihn mit einem Chromium. WACHSTUM_VORHER: der Kopf vor dem Push —
              # auf integ-probe misst die Wachstums-Wand jeden Merge des Pushes einzeln.
              env:
                  WACHSTUM_VORHER: ${{ github.event.before }}
              run: npm run check:statik

            - name: Streu-Wahrheit (die Studio-Arten der Nah-Streu tragen das Farb-Gesetz, ihr Stoff liest den EINEN Himmel)
              if: matrix.gruppe == 2
              # GPU-frei, reines Node: liest die Boden-Zeilen des Pflanzen-Kerns (placement.boden ring nah), jeder Emitter mit
              # weichem Gewebe backt seine Palette über vegFarbe; die Senken zeichnen mit dem Studio-Stoff (nie Lambert —
              # r184-Lambert liest scene.environment nie diffus) und wiegen im EINEN Wind; der Karten-Codec kodiert sRGB.
              run: npm run gate:streu-wahrheit

            - name: Mensch-Anatomie (Welle 5 — Hand, Arm, Kopf, Gesicht, Fuß gegen die Anthropometrie)
              if: matrix.gruppe == 2
              # GPU-frei, reines Node (three r128 im vm): das Gesetz bauMensch + morphAuf mit den Start-Dials, die Arme
              # gerade, normiert auf die Körperhöhe — Hand-Länge/-Breite, Handgelenk, Unterarm/Oberarm, Kopf-Höhe/-Breite,
              # Pupillen-Abstand, Augapfel, Iris, Mund, Fuß gegen koerper-core MENSCH_SOLL. --selftest zuerst: 1,5-fache
              # Hand, doppelte Augäpfel, doppelter Pupillen-Abstand → rot.
              run: npm run gate:mensch-anatomie

            - name: Single-Quote-Template-Strings (B2-Pattern)
              if: matrix.gruppe == 2
              run: |
                  # Erkennt Funktionsaufrufe wie foo('… ${x} …') – ${...} in einfach-quotierten
                  # String-Argumenten interpoliert nicht. Backticks innerhalb von Bezeichnern
                  # werden bewusst nicht gematcht (auch wenn sie Apostrophe enthalten).
                  if grep -nE "\(\s*'[^']*\\\$\{[^}]+\}[^']*'\s*[,)]" stamm/*.js; then
                    echo "❌ Single-Quote-Template-String erkannt – Backticks verwenden"
                    exit 1
                  fi
                  echo "✅ Keine fehlgeschlagenen Template-Strings"

            - name: Verbotenes dynamisches Auswerten (eval / new Function)
              if: matrix.gruppe == 2
              # Ring 2 Phase 5: die DSL ist der einzige Pfad für dynamische
              # Effekte. Wenn dieser Grep wieder fündig wird, schaltet jemand
              # das Sicherheits-Modell aus.
              run: |
                  if grep -nE "(eval\(|new Function\()" stamm/*.js save-server.js; then
                    echo "❌ Dynamisches Code-Eval gefunden — DSL nutzen, nicht eval/new Function"
                    exit 1
                  fi
                  echo "✅ Kein dynamisches Code-Eval"

            - name: innerHTML-Schreibzugriffe (Hinweis, kein Fail)
              if: matrix.gruppe == 2
              continue-on-error: true
              run: |
                  grep -nE "innerHTML\s*\+?=" stamm/*.js || echo "keine Treffer"

            - name: TODO/FIXME-Übersicht (Hinweis, kein Fail)
              if: matrix.gruppe == 2
              continue-on-error: true
              run: |
                  grep -nE "(TODO|FIXME|XXX|HACK|TBD)" stamm/*.js save-server.js || echo "keine TODOs"

            - name: Fahrzeug-Asset-Vertrag v3 (vehicle-core buildInstance byte-eingefroren, Plattform-Probe)
              if: matrix.gruppe == 2
              # cv:3 (spec/asset-contract/v3): 12 frozen sha256-Goldens (5 Gattungen × 2 Seeds + 2 ov-Kulturen),
              # Node-direkt (r128) — Determinismus · Geometrie seed-invariant, der Same waehlt den Lack · ov-Kanal ·
              # Plattform-Probe (Math.pow ±1 ULP kippt kein Byte; sin/cos/atan2/hypot halten ihre Ratsche,
              # spec/asset-contract/plattform-ratsche.json) · Selbst-Test. Bis zur Integration W5 lief er nur lokal.
              run: npm run gate:vehicle-contract

            - name: Tor-Asset-Vertrag v4 (porta-core buildInstance byte-eingefroren, Byte-Raster am Ausgang)
              if: matrix.gruppe == 2
              # cv:4 (spec/asset-contract/v4): 16 frozen sha256-Goldens (7 Ordnungen × 2 Seeds + 2 ov-Faelle), Node-direkt
              # (r128) — Determinismus · Seed-Invarianz · ov-Kanal · lod-Klemme · Plattform-Probe (jede Transzendente
              # ±1 ULP kippt kein Byte: das Raster am Ausgang, Ratsche 0) · Selbst-Test. Bis S1 Waende lief er nur lokal —
              # und war unter Node 22 rot (16/16, three r128 CatmullRom 'centripetal' + convertSRGBToLinear rufen pow).
              run: npm run gate:porta-contract

            - name: Klingen-Asset-Vertrag v5 (W-A4a — schmiede-core buildInstance byte-eingefroren)
              if: matrix.gruppe == 2
              # cv:5 (spec/asset-contract/v5): 44 frozen sha256-Goldens (21 Gattungen × 2 Seeds +
              # 2 ov-Fälle), Node-direkt (r128, kein Browser) — Determinismus · Seed-Invarianz ·
              # ov-Kanal · lod-Klemme · Split-Parität buildInstance==buildWeaponModel je Gattung ·
              # Plattform-Probe (Math.pow ±1 ULP kippt kein Byte, Täter Datei:Zeile; sin/cos/atan2/hypot halten ihre
              # Ratsche, spec/asset-contract/plattform-ratsche.json) · Selbst-Test.
              run: npm run gate:schmiede-contract

            - name: Daten-Vertrag v7 (W-A6/W-A7 — die MESHFREI-Kerne byte-eingefroren)
              if: matrix.gruppe == 2
              # cv:7 (spec/asset-contract/v7): sha256 ueber PRESETS+PARAMS je Kern (klang/
              # koerper/tetrapoda), Node-direkt (THREE-frei) — Schema (klang: bpm/Skala==
              # scaleFor(darkness)/dna-Baender · motion: endliche Profile) · Determinismus
              # (zwei frische vm-Kontexte byte-gleich) · Selbst-Test (Schema-Bruch rot) · Plattform-Probe
              # (S1 Waende: die Daten rufen beim Laden keine Transzendente, Ratschen-Zeile v7).
              run: npm run gate:daten-contract

            - name: Schnell-Playtest (Kern-Gesundheit, ~13 Checks)
              if: matrix.gruppe == 2
              # Bootet die Welt render-gestubbt + kurzer Plateau-Warmup + die Kern-Gesundheits-Checks
              # (Crash · Welt/Terrain baut · Avatar-Rig/Kreatur/Bauplan baut · Resonanz-Rollen · Stats).
              # Schliesst zuverlässig in Minuten ab — der reliable per-Push-Gate. Der volle Playtest
              # läuft in der vollen Batterie (in Gruppe 1).
              run: npm run playtest:fast

    kopf:
        # EIN URTEIL JE KOPF (K61, Richter 22.10.): vor der vollen Batterie fragt dieser Job die API nach den anderen Läufen auf
        # demselben Kopf (SHA): trug einer die volle Batterie grün, läuft sie nicht noch einmal (voll=nein), trug einer die
        # Echt-Gruppe grün, sie auch nicht (echt=nein); läuft ein älterer noch, wartet er bis 30 min auf sein Urteil (grün steht,
        # rot ist ROT, abgebrochen fährt selbst). Nachts urteilt derselbe Richter (main trägt den Kopf von integ-probe), auf Abruf
        # und auf einem PR läuft alles; ein Fehler der API ist rot. gate:ci-deckung (V) KOPF hält die Form.
        name: kopf
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/integ-probe' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ci voll]')
        runs-on: ubuntu-latest
        timeout-minutes: 35
        permissions:
            actions: read
            contents: read
        outputs:
            voll: ${{ steps.kopf.outputs.voll }}
            echt: ${{ steps.kopf.outputs.echt }}
            matrix: ${{ steps.kopf.outputs.matrix }}
        steps:
            # DIE AUSWAHL NACH KONSUM braucht die Geschichte (Ahnen, Wechsel seit dem Grund — ohne Blobs, die holt git je Datei
            # nach) und js-yaml (die Schritte am Kopf und am Grund)
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  filter: blob:none

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Cache-Schlüssel
              id: schluessel
              run: node scripts/ci-schluessel.cjs

            - uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ steps.schluessel.outputs.npm }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Dependencies installieren (ohne Chrome)
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Ein Urteil je Kopf (trägt ein anderer Lauf diesen Kopf schon grün durch die volle Batterie?)
              id: kopf
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/ci-kopf.cjs

    voll:
        # DIE VOLLE BATTERIE — jede Wand, die nicht im Puls steht: die Echt-Renderer-Linsen, die Begehungen, die schweren
        # Verträge, die Erst-Zeichnungs-Wand, die Tier-Anatomie — und der VOLLE PLAYTEST in Gruppe 1 (K18):
        # bis 11.10. lief er nur nächtlich in playtest-full.yml (blockt keinen Merge; die „3,5 h" von einst waren lange
        # geheilt, auf main 86–148 s je Lauf), K15 fiel deshalb erst am Merge. Die Gruppen verteilt nach dem p90 je
        # Schritt (spec/ci/ci-zeiten.json), die größten zuerst in die leichteste Gruppe — `node scripts/ci-zeiten.cjs` misst
        # und schreibt die Gruppen hier (CW2). Ein neuer Gate-Schritt trägt genau EINE Gruppe und seine Zeit in ci-zeiten.json;
        # gate:ci-deckung fällt rot bei einem Schritt ohne Gruppe, einer Gruppe außerhalb der Matrix, einem doppelten Schritt,
        # einer Gruppe ohne Schritt, einer Gruppe mit Mitfahrern über dem Mittel ihrer Klasse + 0,5 min, einem Schritt ohne
        # Zeit und mehr Jobs zugleich als Läufer-Plätze; die Wanduhr steht als Zahl. fail-fast aus. K61 (CI-Diät): die Wanduhr der vollen Batterie
        # lag bei 15–25 min (11 Gruppen, Median 7,7–13,2 min, 38620083409 · 38616535092), mit 20 Gruppen bei 12,3 min
        # (38632403330: 22 Jobs gegen 20 Läufer-Plätze, dazu ein Doppel-Lauf auf main) — jetzt 18 Gruppen, getrennt nach
        # Klasse (cpu · gpu), neben den 2 Puls-Gruppen genau die 20 Plätze des Kontos, hinter dem Kopf-Richter; gate:haus-welt
        # fährt seine 21 Welten in zwei Teilen, die Erst-Zeichnungs-Wand in zwei Teilen, npm und Chrome aus dem Cache. CW (16.10.):
        # die Waage misst — die Mediane der letzten 7 Läufe, die Job-Dauer je Gruppe, der Kopf der Quelle (vorher 6,9 min
        # angenommen, gemessen bis 12,8 min je Gruppe); 7 CPU-Gruppen (1–7), 11 GPU-Gruppen (8–18), die Fenster-Wand allein in 8.
        name: voll ${{ matrix.gruppe }}/18 ${{ matrix.klasse }}
        needs: kopf
        if: needs.kopf.outputs.voll == 'ja'
        strategy:
            fail-fast: false
            # die Gruppen aus der Tafel VOLL_GRUPPEN (oben): der Kopf-Richter reicht sie ganz oder nach Konsum gewählt
            matrix: ${{ fromJSON(needs.kopf.outputs.matrix) }}
        runs-on: ubuntu-latest
        # die Klasse der Gruppe reist an jeden Schritt: die Weiche (scripts/lib/welt-boot.cjs) urteilt mit ihr
        env:
            CI_KLASSE: ${{ matrix.klasse }}
            KONSUM_ZEUGE: ${{ github.workspace }}/../konsum
        # DER KONSUM-ZEUGE (Spike „Die CI wählt nach Konsum"): jeder run-Schritt trägt ihn per NODE_OPTIONS in jeden Node-Prozess
        # (scripts/lib/konsum-zeuge.cjs) — was er vom Baum liest, steht am Ende je Wurzel in konsum.json, dem Artefakt der Gruppe.
        # Über die Shell, weil $GITHUB_ENV NODE_OPTIONS nicht setzen darf und eine Job-env checkout vor dem Baum träfe; pipefail für alle.
        defaults:
            run:
                shell: env NODE_OPTIONS=--require=${{github.workspace}}/scripts/lib/konsum-zeuge.cjs bash --noprofile --norc -eo pipefail {0}
        # 20 je Gruppe, und (T) FRIST hält ihn über 1,2 × dem p90-Plan jeder Gruppe: die echten Renderer laufen auf SwiftShader je
        # Läufer bis 2,8× langsamer (Kamera-Leib-Linse am selben Kopf 319 s und 841 s); neben 287 s anderer Schritte brach G18 am
        # Deckel (7 Läufe zu 20,3 min, 25.10.), allein trägt die Linse höchstens 15,2 min.
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            # die Caches wie im Puls: der Inhalt als Schlüssel (scripts/ci-schluessel.cjs), nie die Projektversion
            - name: Cache-Schlüssel
              id: schluessel
              run: node scripts/ci-schluessel.cjs

            - uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ steps.schluessel.outputs.npm }}
                  restore-keys: npm-${{ runner.os }}-

            - uses: actions/cache@v4
              with:
                  path: ~/.cache/puppeteer
                  key: puppeteer-${{ runner.os }}-${{ steps.schluessel.outputs.chrome }}
                  restore-keys: puppeteer-${{ runner.os }}-

            - name: System-Libs für headless Chromium
              # K61: nur was fehlt — das Läufer-Bild trägt die Bibliotheken mit seinem Chrome, apt-get update kostete je Job ~9 s
              run: |
                  LIBS="libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2"
                  # gefragt wird nach den Bibliotheken selbst (24.04 benennt die Pakete mit t64 um, dpkg -s fand sie nie: 38628488866)
                  SO="libnss3.so libatk-1.0.so.0 libatk-bridge-2.0.so.0 libcups.so.2 libdrm.so.2 libxkbcommon.so.0 libXcomposite.so.1 libXdamage.so.1 libXfixes.so.3 libXrandr.so.2 libgbm.so.1 libpango-1.0.so.0 libcairo.so.2 libasound.so.2"
                  DA=1; for so in $SO; do ldconfig -p | grep -qF "$so (" || DA=0; done
                  if [ "$DA" = 1 ]; then
                    echo "System-Libs da"
                  else
                    sudo apt-get update -qq
                    sudo apt-get install -y --no-install-recommends $LIBS libasound2t64 || \
                    sudo apt-get install -y --no-install-recommends $LIBS libasound2
                  fi

            - name: Dependencies installieren (inkl. puppeteer)
              run: npm ci --no-audit --no-fund

            # DER VOLLE PLAYTEST (K18): die ~5340 Invarianten über 242 Bänder, Null-Renderer, 63 s Median — seit CW
            # trägt Gruppe 1 neben ihm CPU-Wände (die Waage wiegt sie). Die Bedingung ist das VERDIKT, nie der Zähler: tee schreibt das Log, der letzte Befehl
            # greift „Alle Invarianten OK" (unter PLAYTEST_STRICT=0 endete der Playtest mit 0 trotz verletzter
            # Invarianten), pipefail trägt den Ausgang des Playtests durch die Pipe. gate:ci-deckung (P) hält die Form.
            - name: Voller Playtest (~5340 Invarianten — das Verdikt „Alle Invarianten OK")
              if: matrix.gruppe == 1
              run: |
                  npm run playtest | tee playtest-voll.log
                  grep -qx "✅ Alle Invarianten OK" playtest-voll.log

            - name: Tier-Anatomie (Welle 5 — die gebackene Gestalt je Art gegen ihre Natur-Bänder)
              if: matrix.gruppe == 13
              # GPU-frei, reines Node (three r128 im vm wie im Foundry-Worker): der Kreatur-Bäcker backt Wolf · Fuchs ·
              # Bär · Hirsch, die Linse misst an der Haut der Ruhe-Pose (normiert auf den Widerrist) Widerrist in Metern,
              # Brusttiefe, Bauch-Aufzug, Rumpf-Länge, Unterarm, Kopf-Höhe, Ohr, Rute und das Fell-Muster am Vertex
              # (Bauch/Rücken, Läufe/Flanke, Rutenspitze/Flanke) gegen tetrapoda ANATOMIE_SOLL, dazu die Dreiecke beider
              # Stufen gegen das Kreatur-Budget. --selftest zuerst: gestreckter Rumpf, einfarbiges Fell, Maßstab 1 → rot.
              run: npm run gate:tier-anatomie

            # DIE ERST-ZEICHNUNGS-WAND (Welle K, die Hänger-Klasse): eine erste Zeichnung baut ihren Stoff im Pass (je Render-
            # Aufruf einer) und lässt ihre Pipeline asynchron entstehen; ein Objekt, das schon zeichnete, baut einen Neubau im
            # Frame und blinkt nie aus. Die Hänger-Linse nannte an der Radeon 1,4–4,2 s Warten nach synchronen Pipelines eines
            # Tier-Erstbaus. Bis 11.10. ein eigener Job, jetzt ein Schritt der vollen Batterie (~5,5 min Median), echter Renderer
            # (swiftshader-WebGPU, kienspan) — Konsum im Boot, drei neue Stoffe ohne synchrone Pipeline der Welt, der Gegen-Lauf
            # auf dem Vendor-Weg MUSS rot sein, der Neubau zeichnet im nächsten Bild (ohne Gedächtnis MUSS er blinken), ein
            # Bundle-Bürger steht ≤ 2 Frames nach seiner fertigen Pipeline wieder in der Aufnahme (Neubau gegen eine offene
            # Pipeline, hängender Fehler-Scope; mit stummer Anmeldung MUSS er fehlen). K61: ein Schritt trug Median 372 s
            # (237–491), die längste GPU-Zeit der Batterie — jetzt zwei Teile in zwei Welten und zwei Gruppen, jedes Band in
            # GENAU einem Teil (scripts/diag-hitch-telemetrie.cjs --teil); `npm run gate:hitch-telemetrie` fährt beide.
            - name: Erst-Zeichnungs-Wand Teil 1 (echter Renderer — Boot-Konsum, drei neue Stoffe ohne synchrone Pipeline, Neubau, Bundle-Neubau)
              if: matrix.gruppe == 17
              run: node scripts/diag-hitch-telemetrie.cjs --teil=1

            - name: Erst-Zeichnungs-Wand Teil 2 (echter Renderer — Bundle ohne Anmeldung, hängender Fehler-Scope, Beweis-Aufnahme, Absage)
              if: matrix.gruppe == 16
              run: node scripts/diag-hitch-telemetrie.cjs --teil=2

            - name: Fenster-Wand (ein Fenster-Wechsel macht die Welt nie wieder schwarz)
              if: matrix.gruppe == 17
              # Faehrt den ECHTEN Frame (swiftshader, kienspan mit der Pixel-Kappe des Holzes nah, das Fern-Wasser als ruhender
              # Leser des Tiefen-Abbilds) mit LAUFENDEM Loop am Bach der Mess-Wiese: vergroessern, DPR 2 (die Kappe stellt die
              # Pixel-Ratio Frames nach dem Ereignis), zurueck, die Pixel-Ratio allein — je Schritt keine WebGPU-Validierung,
              # gezaehlt in gerenderten Frames. Der resize-Handler baut keinen Leser neu (die Diaet traegt jeden
              # Groessenwechsel, die Quelle haelt es); ohne ihren Vorher-Textur-Waechter faellt der Pixel-Ratio-Schritt beim Namen. EIN Boot.
              run: npm run gate:fenster-wechsel

            - name: Schirm-Wand (ein kleinerer Schirm traegt hoechstens gleich viel Welt, jede Schirm-Groesse aus der EINEN Quelle)
              if: matrix.gruppe == 4
              # Faehrt die echte Welt (Null-Renderer, Foundry an, der Zeichenpuffer ist der Canvas) durch den ECHTEN
              # resize-Handler in drei Fenstergroessen, gespiegelt: je Pass und Taeter-Klasse zaehlt das kleinere Fenster
              # hoechstens so viel wie das groessere (Spannen, beide Klammern); das Fell-Gesetz liest den EINEN Schirm-
              # Massstab (`_schirm`), kein Gesetz liest den Schirm an ihm vorbei; die Selbsttests feuern.
              run: npm run gate:schirm-monotonie

            - name: Werfer-Wand (jede Kaskade misst ihre Scheibe, jeder Schatten-Pass waehlt seine Werfer)
              if: matrix.gruppe == 1
              # Faehrt die ECHTEN Methoden an einer echten CSM-Instanz (GPU-frei): die Box deckt jeden Boden-Punkt im
              # Blick, den der Addon-Shader liest (Mittag/Abend), ist eng, rastet und schnappt aufs Texel-Raster; die
              # Karte traegt die laengste Box-Kante bei texelM, ihre Ziele sind r8 + 16 bit ab dem Bau; je Pass nur
              # Regionen und Werfer in der Kaskaden-Box, der Boden-Satz ist Empfaenger und Werfer, jede Werfer-Klasse
              # der Szene ist der Box bekannt; EIN Kompilier-Weg, EINE Szenen-Tiefe; Kompilate stellen keine Kaskade.
              # Die Selbsttests zeigen, dass die alten Regeln (Haupt-Urteil je Pass, Huellen ohne Boden) rot werden.
              run: npm run gate:schatten-werfer

            - name: Schatten-Bias (das Gesetz der Kaskade statt eines festen Meter-Werts)
              if: matrix.gruppe == 17
              # Die Quell-Wand am Stamm: normalBias und den Tiefen-Bias einer Schatten-Karte schreibt nur das Gesetz
              # (`_schattenBias`: Texel der Kaskade, EINE Quelle atmosphere.shadowBias). Der Selbsttest zeigt, dass ein fester
              # Meter-Wert, ein leerer Schatten, eine vakuöse Probe, Akne und eine blinde Akne-Probe rot werden. Die Messung am
              # echten Renderer (Boden-IoU kleiner Werfer, Akne-Platten, Zähne) fährt der OMEN: diag-schatten-bias.cjs --echt.
              run: npm run gate:schatten-bias

            - name: Schatten am Terminator (1110-5 - die Hang-Akne, die Zuwendung der wahren Normale)
              if: matrix.gruppe == 12
              # Die Werkbank im Software-Holz mit Schatten (holz voll) an der 30-Grad-Rampe der Pruefbuehne, die Sonne am Terminator
              # (22 Grad aus Azimut 45, N.L -0,002): von oben je ein Schuss mit und ohne Schatten, gemessen nur auf der Rampe - ROT
              # beim Namen, wenn der Schatten die Rampe fleckig macht (main 2c8deda9: 11,7 % gegen 0,2 %). Lokal 78-119 s, CI 181 s
              # (38180625147), Median 177 s - in Gruppe 5 (V18.543 gang-gesetz: Gruppe 2 trug mit dem Haus der Welt 405 s 11,9 min).
              run: npm run gate:schatten-terminator

            - name: Persistenz-Härtung Teil 1 (Tab-Tod 0-7 ohne save-server, Lade-Pfad, save-server stirbt ganz)
              if: matrix.gruppe == 9
              # speicher.K1: der Browser stirbt hart (im Schreiber oder zufällig), der nächste Boot lädt EIN Schreiben, <= 10 s alt,
              # keine halbe Welt, jedes Loch steht (die Linie über 256, K23); der Selbsttest schreibt den Platz in zwei Zügen und
              # sieht ROT. Dazu der Korpus (speicher.K5: je Versions-Stufe ein Stand ihrer Version lädt am Kopf, daraus (U) (W) (K)),
              # (S) (C) der save-server. Basis b9537781 ROT: 10 von 21 Boots halb.
              run: npm run gate:persistence

            - name: Persistenz-Härtung Teil 2 (Tab-Tod 8-19 ohne save-server)
              if: matrix.gruppe == 11
              # ohne den Gang (D): Teil 1 geht ihn (1 km in 6 min, dasselbe Urteil), hier ginge er ein zweites Mal
              env:
                  PERSISTENCE_TABTOD: 8-19
                  PERSISTENCE_WEG: 0-0
              run: node scripts/diag-persistence.cjs

            - name: Dichte-Spiegel (Main und voxel-worker bauen jedes Chunk-Gitter byte-gleich, mit Edits ueber dem Band)
              if: matrix.gruppe == 13
              # Faehrt die echte Welt (Null-Renderer) und vergleicht je Ort und LOD 0-3 das Gitter des Mains
              # (`_voxelEditedDensityGrid`) mit dem des Workers (`computeDensityGrid`) Wort fuer Wort - die Standard-Welt
              # (Mess-Wiese, Genesis, ein Fluss) und die Pruefbuehne (spec/pruefbuehne/welt.json, ihre Stationen), dazu
              # eine Fuell-Kugel ueber dem Band. Der Selbsttest verfaelscht EINEN Term nur im Worker und muss rot werden.
              # Die Kern-Probe (`--kern`): an 10^5 Punkten Stamm-Leser = Worker-Feld = Kern, die feste Mutations-Liste zieht beide.
              run: npm run gate:worker-dichte

            - name: Gelaende-Linse (die Natur-Zahlen am Gesetzbuch - Senken, Flint, Hammond, Dorfplaetze, Schicht-Gesetz)
              if: matrix.gruppe == 11
              # Node ohne Browser: gelaende-core in einer vm, drei Welt-Saaten, 4 x 4 km innen + 2 km Rand im 30-m-Raster
              # (Nordstern 4.1, Karte K16). Taeter je Ziel beim Namen; der Selbsttest legt eine Eier-Karton-Stoerung auf und
              # muss die Senken rot faerben. Dazu der GEBAUTE Boden (Null-Renderer, drei Saaten, 2 x 2 km im 30-m-Raster): Senken
              # > 1 m und Dorfplaetze am Boden des Spielers mit Kanal und See; der Selbsttest legt die alte Bett-Tiefe auf.
              run: npm run gate:gelaende-realismus

            - name: Gelaende-Studio (A ist die gebaute Welt, jeder Regler wirkt, jedes Preset im Korridor, EIN Plan reist byte-gleich in die Welt)
              if: matrix.gruppe == 12
              # Faehrt index.html?studio=gelaende (Null-Renderer) ueber einer Welt, die kein Plan beschreibt (Basis 7 m,
              # Rampe): der Start zeigt A und nennt Rampe und Basis als Abweichung; A zeigt dieselbe Welt (Makro-Abdruck + Statistik); jeder Regler aus LANDFORM_REGLER einmal ueber
              # sein Schieber-Element (tot = das Raster bleibt byte-gleich); jeder Landschafts-Knopf (bedienung.json) ohne
              # rotes Ziel, das Schicht-Gesetz an mindestens einem; der Export (EIN Plan) durch das Welt-Tor, nach dem
              # Reload derselbe Makro-Abdruck (64 x 64) und dieselbe Statistik in der Welt, und die Karte malt den Schnee der
              # Boden-Farbe der Welt in ihrer Palette. Der Selbsttest: ein Schritt am Regler "hoehe" aendert den Abdruck, ein
              # Preset ausserhalb des Korridors, ein Start auf B und eine Karte ohne Schnee fallen rot (Karte K16b).
              run: npm run gate:gelaende-studio

            - name: Pruefbuehne (wo die Wildnis nicht traegt, wirft das Feld nichts - auch nicht der Nexus; S4 steht an ihrer Spec; S0 leuchtet nachts aus dem Licht-Pool)
              if: matrix.gruppe == 16
              # Faehrt die echte Welt (Null-Renderer): jede Ort-Op der Welt-Akte mit der Quelle des Feldes (nexus,
              # rule:nexus), den getriebenen Nexus-Takt und den Absenz-Zensus in 300 m - auf der Pruefbuehne
              # (spec/pruefbuehne/welt.json) Zuwachs 0 je Wurf, in der Wildnis als Feld-Kontrolle > 0, der Akt des Menschen
              # setzt auf beiden. Der Selbsttest laesst die Wildnis zum Schein ueberall tragen: jeder Wurf faellt rot beim Namen.
              # Dazu die S4-Probe: die sechs Hindernis-Koerper der Saat (stationen.json s4-hindernisse) stehen je Teil
              # mit ihrer Blocker-Box <= 0,1 m an der Spec und im Blocker-Netz; der Selbsttest rueckt die Mauer 0,5 m.
              # Dazu die S0-Probe (K11): die Feuerstelle des Menschen leuchtet nachts aus dem Licht-Pool (mit und ohne Klang),
              # die Laterne eines Plans nachts an und mittags aus, die Fenster-Glut nach dem Zeitplan, JEDER beleuchtete Stoff
              # (Bauer im Stamm, Stoffe der Buehne und der Wildnis) traegt den Pool, EIN Punktlicht-Gesetz, kein Szenen-Licht.
              run: npm run gate:pruefbuehne

            - name: Pruefbuehne S0 im Bild (echter Renderer - der Feuerkreis aus 2 m traegt Luma >= 0,15 in der Ausgabe)
              if: matrix.gruppe == 18
              # Faehrt die Pruefbuehne am ECHTEN Renderer (swiftshader, kienspan): die Feuerstelle ueber den Satz des Menschen,
              # Mitternacht still, das Auge 2 m vor dem Feuer, aufgenommen ueber den Ausgabe-Pfad (Tonkurve, sRGB, Post) - der Schuss
              # zeichnet die Naehe des Feuers (Saetze, Feuer, Leib; Huellen >= 1 km und ferne Bauten fallen, 8 Programme); der Boden
              # in 0,75 / 1,25 / 1,75 m um das Feuer traegt Luma >= 0,15 (K11 Abnahme). Der Selbsttest leert den Licht-Pool:
              # der Kreis faellt unter die Schwelle und nennt den Pool. Dazu der Himmel folgt dem Sprung (K10, seit D3 hier: der
              # Himmel lebt auf der GPU): nach Mittag und Mitternacht ueber den Pfad des Spielers traegt die zurueckgelesene
              # Umgebung die Bestrahlung des geltenden Himmels; der Selbsttest macht den Maler taub und nennt ihn.
              run: npm run gate:pruefbuehne-licht

            - name: Weltgrenze (kein Feld einer Welt reist in die naechste, keine geht verloren - Laden, Ersetzen, world-pull, Portal, Einladung, Geburt, Reload)
              if: matrix.gruppe == 8
              # Faehrt die echte Welt (Null-Renderer) je Weg in einem frischen Browser-Kontext: Welt A traegt ein Zeichen in
              # jedem welt-eigenen Feld (Erbgut der Pruefbuehne, Anker, Edits, Dorf-Zellen, Stempel, Rolle, Gedaechtnisse der
              # Seite, ein Tier), Welt B ist eine Wildnis-Welt ohne all das. Nach jedem Weg nennt die Linse jedes Feld von A,
              # das B in der Seite, in ihren Lesern, im Worker-Spiegel oder im Speicher traegt, beim Namen. Der Selbsttest
              # mischt den alten Spread am Lade-Engpass zum Schein darunter und muss rot werden.
              run: npm run gate:weltgrenze

            - name: Boot-Rettung (der Boot verliert die Welt des Aktiv-Zeigers nie - Platz, .bak, IndexedDB, dann erst frisch und laut)
              if: matrix.gruppe == 8
              # Faehrt die neun Speicher-Formen der Boot-Sonde (Platz ohne worldId, ohne worldMeta, Legacy ohne worldId, ohne
              # worldMeta, mehrere Welten + Wechsel, korrupter Platz + gueltiges .bak, nur IndexedDB, IndexedDB frischer, und ein
              # Zeiger auf eine Welt, die nirgends liegt) je in einem frischen Browser-Kontext: Boot 1 erwacht in der Welt der Form
              # mit ihrer Marke, Boot 2 bleibt stabil, die leere Form erwacht frisch und laut. Der Selbsttest laesst die
              # Rettungs-Kette zum Schein nur den Platz lesen und muss an korrupt, nur-IDB und IDB-frischer rot werden.
              run: npm run gate:boot-rettung

            - name: Render-Tap-Wahrheits-Wand (W1 — die vergiftete Zahl kann nicht zurück)
              if: matrix.gruppe == 6
              # Fake-Info mit exakter r184-Semantik (calls=Lebenszeit, drawCalls=pro Frame) am EINEN Tap:
              # der Tap liest den PRO-FRAME-Zähler, sense.renderCalls bleibt beschränkt + session-invariant
              # (die V18.427-Klasse als Invariante), der Regler-Eingang renderLoadMs ist ehrlich; statisch:
              # kein Render-Linsen-Skript liest `.calls` nackt, der Flugschreiber trägt das version-Feld.
              run: npm run gate:render-tap

            - name: Takt-Atem (echter Renderer — der atmende Regler weckt keinen Fege-Takt und keine Pass-Lage)
              if: matrix.gruppe == 14
              # Faehrt die echte Welt (swiftshader, kienspan) ohne Loop und ohne Wanduhr: der Aktuator steht auf festen Stufen
              # (loadScale 1 -> 0,1 -> 1, je 80 Takte) und atmet darueber; gezaehlt je Takt (zweite Haelfte jeder Stufe): die
              # Wechsel der Laub-Dichte, die Weckrufe des Stand-Stempels durch sie, die neuen Lagen des Hauptbilds, dazu
              # _tickArchitectureLOD, _lodTreeVisHeight, _foundrySichtHoehe, _chunkSatzAbschnitt, _hoehlenSicht. main 66005ca6:
              # Dichte, Stempel und Lage in 100 % der Takte (CPU-Takt frei 4,8 -> 11,7 ms). Gegenprobe (stossende Dichte) und
              # --selftest zuerst.
              run: npm run gate:takt-atem

            - name: Volle-Bühne-Prädikat (W2 — Kriterium 2 wird messbar)
              if: matrix.gruppe == 15
              # „Volle Bühne" als Prädikat aus kanonischen Quellen (Ring am Ziel · Gras/Wasser leer ·
              # die Streu steht: `_streuWartet` 0, keine Region in Reichweite fehlt, wartet oder trägt
              # eine offene Scheibe · Bibliothek warm · Impostoren idle · Nebel offen), der Takt, in dem es
              # schließt (die Zeit misst die Kalt-Zeile von außen, --kalt); Selbst-Test: die wartende
              # Spieler-Region und die fehlende Regionen-Karte machen das Prädikat rot, die Bühnen-
              # Wahrheit der Welt (`_buehneSteht`) liest dieselbe Streu, ihr Deckel öffnet laut (WARN).
              # Headless = Mechanik-Ordnung; die Wall-Clock-Wahrheit liefert die Schöpfer-GPU (W8).
              run: npm run gate:boot-stage

            - name: Streu-Fernform aus dem Studio-Budget (jenseits der EINEN Nah-Grenze 64 m kein stilles L0)
              if: matrix.gruppe == 12
              # B2c lod.budget[kind].fernform (karte · gesetz · boden) ist KONSUM jenseits ANALOG_NAH_M: der Flip
              # rock.fernform="boden" baut eine Region neu und ihre Fels-Zellen tragen form boden; keine Gesetz-/
              # Boden-Art steht als Instanz jenseits Grenze + Totband, diesseits trägt keine Zelle eine Fernform;
              # im eingeschwungenen Ring ist die Kapsel-Liste nicht voll; wartende Gesetz-Zellen legen im Tick keine
              # Slots an und rechnen keinen Fit; Geröll passt fern aus seinen 6 größten Steinen. Selbst-Tests: eine
              # injizierte Geröll-L0-Instanz bei 200 m wird rot (mit Namen), die ECHTE Erschöpfung lässt Zellen
              # warten (0 L0) und setzt die Wand im Allokator, ein fehlendes fernform bricht fail-closed.
              run: npm run gate:streu-fern

            - name: Asset-Vertrag v1 (Studio-Generator trifft die eingefrorenen Goldens byte-genau)
              if: matrix.gruppe == 10
              # P1 des neues-kleid-Pipeline-Plans: der Studio-Generator (phytogenesis.js als Worker)
              # baut die kuratierten Goldens (spec/asset-contract/v1) neu und vergleicht Byte fuer Byte
              # + Schema (cv:1, Pflichtfelder). Ab hier kann KEIN Refactor der Pipeline mehr still
              # driften — der Vertrag richtet (P0 bewies Worker==iframe 720/720 byte-identisch).
              # Plattform-Probe (S1 Waende): 43 Faelle bauen in einem zweiten Worker mit ±1 ULP auf jeder
              # Transzendenten — die Pflanzen sind ungerastert und stehen benannt (plattform-ratsche.json, Zeile v1).
              run: npm run gate:asset-contract

            - name: Pflanzen-Nahbild (Rinde · Gitter · Strauch · Blüte · Blatt-Maß · Unterseite · Weide · Fracht)
              if: matrix.gruppe == 1
              # 05.10.: die gelieferten Puffer je Art der Klasse über die echte Foundry-Naht — Birke weiß mit Lentizellen,
              # schwarzer Fuß-Borke und dunklen Zweigen, jede Rinde im Albedo-Band, kein Ringel über dem Ring-Gitter,
              # der Strauch aus Karten mit Reisig, Saftmal-Verlauf der Blüte, Blatt-Maß der Laub-Karten, die zwei Leser
              # der Blatt-Unterseite. Der Selbsttest macht gipsweiße Birke, Ringel-Stamm, Klingen-Strauch, einfarbige
              # Blüte, Blatt x3 und einen fehlenden Leser rot. Integration 05.10.: jede Karte der Weide liest die Weiden-Zelle,
              # und die Fracht des Blatt-Atlas (BC1 / rgba, vormultipliziert) liest durch den EINEN Leser je Stufe wie das
              # Labor (± 3 %) — BC1 gerade gelesen (ohne Teilen durch alpha) macht der Selbsttest rot.
              run: npm run gate:pflanzen-nah

            - name: Sippen-Wirt (das Budget-Gesetz zaehlt, was der Wirt zeichnet)
              if: matrix.gruppe == 10
              # Integration W8 (Pruefer W8 (c)): im echten Spiel (foundry-ON, Null-Renderer) baut die Linse jede Art mit
              # Budget-Zeile auf jeder deklarierten Geometrie-Stufe - Flatten (Haus, Fahrzeug, Waffe, Tor, Baum, Strauch,
              # Fels, Boden-Streu) und Ofen (jede Gattung, der Mensch) - und verlangt phyto-core budgetSippen == die
              # Leaves des Wirts (Draws und Dreiecke). Im selben Lauf der Selbst-Test: ohne Verschmelzen bzw.
              # Starr-Bindung muss sie die Abweichung nennen.
              run: npm run gate:sippen-wirt

            - name: Pack-Kanon (N3 — die Gestalt-Reise als dokumentierter, mintbarer Vertrag)
              if: matrix.gruppe == 5
              # N3 (Nervensystem Phase γ): (a) spec/pack/v0/CONTRACT.md trägt die Pflicht-Abschnitte
              # (v0-Ist-Kanon · v1-Schema · Ü1/Ü2-Chokepoint); (b) der Platten-Stempel der Transport-Schale
              # hasht Manifest + alle Manifest-Skripte (kommentar-gestrippter Source-Grep — die Drift-Wand);
              # (c) der Ship-Hook __anazhLiveBake===false lebt im Request-Pfad und reist als nurPlatte zur
              # Schale (Source + VERHALTEN: Hook an → null trotz ready-Worker); (d) der Roundtrip-
              # Beweis: EIN Preset (eiche, lod 2) live minten → zurücklesen → byte-gleich (sha256 je
              # Puffer, unabhängig vor der b64-Kodierung gerechnet). --selftest zuerst: ein korruptes
              # Pack-Artefakt macht die Linse rot (nicht vakuös).
              run: npm run gate:pack-contract

            - name: Fluss-Wand (V18.511 — der Foundry-Kanal kostet den Haupt-Thread nur den Gruppen-Bau)
              if: matrix.gruppe == 1
              # Die Transport-Schale läuft IM Foundry-Worker vor dem Studio: Platte (Stempel · Get · Put),
              # Konsum-Wand (FOUNDRY_LESEN == die Leser von _foundryBuildMesh), Uint16-Index, Transfer.
              # Statisch: Wand == Leser, der Asset-Store lebt NUR in der Schale. Verhalten: echter Worker +
              # IndexedDB (Wand · Verengung · abgelöster Puffer · Platten-Treffer · nurPlatte · Format-Bust ·
              # Saison-Nagel · Vorrat · Karten-Platte). V18.527: Gestalten aus dem Studio-Budget (Klon-Linse, hohe
              # Hash-Bits), keine Saison im Körper-Schlüssel, keine tote Fracht, der Stempel hasht die Shells;
              # Welt-Sonde (Null-Renderer, echter Studio-Worker, Platte an): Gestalten je Art = Budget, 0 Karten-Art-
              # L2, 0 LRU-Räumungen im Boot, ein Saison-Wechsel baut 0, der Zweit-Boot baut <= 5 MB neu.
              # --selftest zuerst: jede Bruch-Klasse macht die Wand rot.
              run: npm run gate:fluss

            - name: Takt-Wand (V18.512 — ein Takt-Subsystem rechnet nur, was es betrifft, nie die ganze Welt)
              if: matrix.gruppe == 9
              # Zählung statt Zeit: 300 brennbare Bauten + EIN fernes Brennglas → der Brennglas-Takt ruft
              # computeCompoundTags 0-mal; 3 Bauten in Reichweite → höchstens 3 je Takt. Befund: Ø 20 ms je
              # Spiel-Takt für die Tags aller Bauten. --selftest: die alte Reihenfolge macht die Wand rot.
              run: npm run gate:takt

            - name: Satz-Wand (Welle B — die Draw-Einheit ist Material mal Geometrie über den Ring, nie Chunk mal Material)
              if: matrix.gruppe == 11
              # Zählt die Render-Bürger je Klasse im Szenen-Baum (GPU-frei): höchstens EIN Boden-Satz (Stitch eingeschlossen),
              # EIN Wasser-Satz, je Nah-Streu-Senke EINE InstancedMesh (keine Waise), keine Deck-Streu, kein @p:-Bau, kein
              # p:-Bundle; Treue (Views byte-gleich, Index verschoben, Blöcke nah → fern) und Konsum (ein Chunk-Abbau
              # ändert den Satz, nicht die Szene). --selftest zuerst: injizierte Täter fallen rot und werden genannt.
              run: npm run gate:chunk-satz

            - name: Höhlen-Sicht (Welle 7 — die Höhlen-Schicht zeichnet nur, was ein Strahl durch Luft erreicht)
              if: matrix.gruppe == 3
              # An der Mess-Wiese, Null-Renderer: Main und Worker liefern den Höhlen-Graph byte-gleich; je Blick (Wiese, Hang,
              # Mündung, IN der Höhle) trifft jeder Strahl gegen den ganzen Boden-Satz zuerst eine Zelle des Abschnitts (kein
              # Loch), und jeder Empfänger, dessen Weg zum Licht Boden trifft, trifft einen der Kaskade (kein Licht-Leck); die
              # Wiese zeichnet weniger Höhle, als ihr Frustum trägt. --selftest zuerst: injizierte Täter fallen rot.
              run: npm run gate:hoehlen-sicht

            - name: Sicht-Arbeit (Welle C — die Sicht-Kette kostet, was sich ändert, nie die Weltgröße)
              if: matrix.gruppe == 5
              # An der Mess-Wiese, Null-Renderer: das Hauptbild über den EINEN Haken, zwei Stellvertreter-Kaskaden über den
              # Satz-Chokepoint samt Instanz-Wahl; die Sicht-Linse zählt je Frame Prüfungen, Ecken, Index-Bytes und Treffer.
              # In Ruhe 0 Arbeit und 0 Bytes ab dem ersten Frame, beim Drehen und Gehen rechnet jede neue Lage, die gehaltene
              # Wahl ist die frisch gerechnete, ein eingeschmuggelter Cache-Bruch fällt rot. Ein Satz-Inhalt zählt nur mit
              # Beleg (Bereich, Anker, Hülle) - ein eingeschmuggelter Stand-Bruch (der Satz zählt nur seinen Stand) fällt
              # als stand:ohne beim Namen rot. Das atmende Auge (Kamera und Maske +-1 mm, unter dem Halt) arbeitet nicht,
              # und die gehaltene Wahl trägt eine Instanz an der Kante ihres Fensters (ohne den Halt als Rand fehlt sie).
              # --selftest zuerst.
              run: npm run gate:sicht-arbeit

            - name: Wetter-Wache (Welle K und Leben-Schau 2 — Halt heisst Halt, Uhr und Wetter gehoeren dem Spieler)
              if: matrix.gruppe == 5
              # Null-Renderer, eine echte Welt: unter der Buehne versucht jeder Schreiber-Weg des Spiels das Wetter zu drehen
              # (Emotion sorrow, Nexus, Gesetz, Mensch, Mitspieler, Auto-Zug) - das Wetter bleibt sunny, jeder Zug steht als
              # verweigert beim Namen seiner Quelle; ein roher Schreiber am _setWeather vorbei faellt rot. Dazu eine frische
              # Welt, das Spiel getaktet mit seinem Nexus (2 x 6 Spiel-Minuten): nach "setze uhrzeit mittag" und "setze
              # wetter sonnig" schreiben die Taeter der Schau (Nexus-Gesetze auf Uhr und Regen alle 4,7 s, Wuerfe, Emotion) -
              # die Uhr geht nur ihren Gang, das Wetter bleibt, jeder Taeter steht beim Namen; nach "frei" zieht nur der
              # Wetter-Zug im Takt das Wort, das die Welt wuenscht; der Regler zeigt die Welt-Zeit; der Tag traegt eine Szene;
              # im Stamm schreibt die Uhr nur _uhrSetzen, kein Nexus-Wurf traegt einen Uhr-Op. --selftest zuerst.
              run: npm run gate:wetter-wache

            - name: Welt-Wache (0710-7 — die Buehne haelt die Welt, jeder Welt-Akt beim Namen)
              if: matrix.gruppe == 6
              # Null-Renderer, eine echte Welt: unter der Buehne versucht jeder Weg des Spiels die Welt zu aendern (Nexus:
              # Dorf, Tiere at_player, Groessen- und Tempo-Wuerfel, Tageszeit; Emotion, Gesetz, Mensch, Mitspieler, ein
              # verzoegertes Programm) - die Welt bleibt, jeder Zug steht als verweigert beim Namen seiner Quelle; ein Akt an
              # dslEval vorbei faellt rot; ohne Halt wirkt das Spiel wie immer; jeder Op der DSL hat ein Urteil, der Nexus
              # komponiert nur beurteilte Ops. --selftest zuerst.
              run: npm run gate:weltakt-wache

            - name: Blocker-Netz (0710-7 — der Strahl fragt seine Nachbarschaft, byte-gleiche Treffer)
              if: matrix.gruppe == 10
              # Null-Renderer, eine echte Welt (zwei Doerfer, Baeume, ein Tempel): jeder Strahl trifft byte-gleich wie die
              # Schleife ueber den ganzen Bestand (kurz, lang ueber den 80-m-Cull, senkrecht, achsparallel, aus einer Box) in
              # fuenf Runden mit Abriss, Kappe, neu gestempelter Huelle, neuem Array und neuen Baeumen; ein Strahl prueft nur
              # die Boxen, die sein Segment beruehren; das Netz ist der Bestand; jeder Schreiber des Bestands stempelt.
              run: npm run gate:blocker-netz

            - name: Kollision = Bild (Leben-Schau 2 — jede Box hat ihr Bild, der Fels misst seine Gestalt)
              if: matrix.gruppe == 9
              # Null-Renderer, Foundry an, die Mess-Wiese (150 m) und je Klasse ein Exemplar (sieben Fels-Arten, GT, sieben
              # Tore, Haus, Brunnen, Marktstand): je Studio-Werk das Bild (die Studio-Gestalt LOD 0 in ihrer Instanz-Matrix)
              # gegen die Blocker-Boxen in ihrem Rahmen — keine Box ragt ueber das Bild, Fels, Tor (ausser der Passage) und Wagen
              # sind ganz gedeckt, der Fels-Blocker misst die gezeichnete Gestalt, kein Blocker baut eine Gestalt auf dem
              # Haupt-Thread (jeder buildInstance eines Kerns am Spawn beim Namen; 10.10.: sieben Tore nachgebaut). Befund 09.10.:
              # der Felsturm stiess als Eisen-Mast 4,4 x 16,8 m. Der Spender-Felsturm und das Tor ohne Pfosten fallen rot beim
              # Namen; Haus und Ausstattung stehen als OFFEN mit Zahl. (V) KONTAKT BEIM TEMPO (physik.K2): Fuchs, Wolf, Baer und
              # Riese im Galopp, der Spieler gehend und im Sprint, der GT bei vmax und der Baer, den er stoesst, gegen Mauer,
              # Fels, Haus, Baum und einen stehenden Baeren, der Fall aus 60 m — bei 144/60/30 fps und dem Takt-Deckel:
              # Eindringen <= 1 cm, kein Durchtritt, Spalt <= 5 cm; der Fuchs mit EINEM Schritt je Takt muss durch die Mauer
              # (vorher 25/114 Zeilen rot). Selbsttest inklusive.
              run: npm run gate:kollision-bild

            - name: Fall-Waechter (Leben-Schau 2 — jeder Koerper steht auf dem Boden unter ihm)
              if: matrix.gruppe == 12
              # Null-Renderer, echter Spiel-Takt: der Wagen im Spaltgrund unter dem Ueberhang (−900,6/−976,1), die Fahrt der
              # Schau ueber die Spaltkante, Wagen, gestossener und sterbender Wolf und Spieler in der Hoehle (−875,5/−1229,4), ein Zensus
              # der Ueberhang-Spalten — keiner faellt durch seinen Grund, keiner springt aufs Dach (Boden-Wahrheit: das
              # Dichtefeld). Befund 09.10.: −6 428 m nach 30 s. AST-Wand: die Koerper-Schritte (auch die Tod-Lage) lesen nur den
              # Boden unter dem Leib, jeder andere Leser der Oberkante an einem Leib ist benannt; der eingeschmuggelte Dach-Leser
              # faellt rot beim Namen; Selbsttest inklusive.
              run: npm run gate:fall-waechter

            - name: Brennglas-Takt (0710-10 — der Takt kostet, was ihn betrifft, byte-gleiche Brand-Urteile)
              if: matrix.gruppe == 3
              # Null-Renderer, eine echte Welt (drei Doerfer, vier Brennglaeser, Brennbares in ihren Brennpunkten): ueber
              # einen Tag (Morgen, Mittag, Regen und Sturm, Nachmittag, Abend, Nacht) urteilt der Brennglas-Takt je Schritt
              # byte-gleich wie der alte Takt ueber den ganzen Bestand (Hitze, Saetze, Feuer), mit Abriss, neuem Array und
              # neuen Zielen mitten im Tag, und fasst nur die Betroffenen an; das Verzeichnis je Affordanz und Kamin ist der
              # Filter ueber den Bestand (auch nach einem nachgezogenen Tor); Resonanz und Dorf-Rauch wie die Schleife.
              run: npm run gate:brennglas-takt

            - name: Raum-Tags (0710-11 — das Gedaechtnis der Raum-Tags sieht jeden Schreiber)
              if: matrix.gruppe == 10
              # Null-Renderer, eine echte Welt: der Schluessel liest jeden Eingang der Rechnung (Proxy-Linse ueber jeden Bauplan);
              # ueber eine Werkstatt-Sitzung (verschieben, Stoff, Form, Farbe, hinzufuegen, loeschen, Undo/Redo, direkte Aenderungen
              # ohne API, defineMaterial, ein geladener Spielstand, neues Teile-Array, neues Bauplan-Objekt) urteilt das Gedaechtnis
              # byte-gleich wie die Rechnung und rechnet nur nach einer Aenderung; ein Schluessel ohne Stoffe faellt rot.
              run: npm run gate:raum-tags

            - name: Stand-Takt (Welle K — im Stand kostet die Welt nichts, Gehen kostet die Änderung)
              if: matrix.gruppe == 1
              # An der Mess-Wiese, Null-Renderer, Fern-Ring über seinen Haken, Foundry an, der Regler hält: die Stand-Linse
              # zählt je Frame die Blatt-Rufe der Fege-Takte (Ring, Stufen-Wahl, Cull, Streu, Nah-Streu, Nah-Wiese, Saum).
              # In Ruhe 0 Einheiten; mit gebrochener Wache arbeitet jeder Takt und keiner ändert die Welt (nichts verschlafen);
              # ein Baum und ein Regler-Schritt wecken, Gehen arbeitet, ein Sprung baut den Spieler-Chunk. Die langsamen
              # Simulationen (feld.K3: Wasser, Regen, Saison, Nachwuchs, Wuchs, Feld) arbeiten in 60 s Ruhe 0 Einheiten und
              # schlafen nach ihrem Ereignis wieder. --selftest zuerst.
              run: npm run gate:stand-takt

            - name: Foundry-Deadlock geheilt (P4 — die Nähe konvergiert unter Last)
              if: matrix.gruppe == 10
              # P4: der overBudget?0-bakeBudget liess die nahen LOD0/1-Bäume unter Last nie backen (=die kahle
              # Nähe). Seit P3a bäckt der Worker off-thread → der Throttle ist hinfällig. Beweist headless, dass
              # unter erzwungenem Dauer-Über-Budget kalte Nah-Bäume zu Foundry konvergieren (vorher: 0).
              run: npm run gate:foundry-deadlock

            - name: Fernwald (der gesetzte Wald ist jenseits der Mesh-Zone seine Karte, kein Satz, kein Pop)
              if: matrix.gruppe == 13
              # Studio-Vertrag B2c fernform "karte": bis 05.10. trug jeder gesetzte Baum jenseits des Cull-Radius
              # einen Kegel-und-Lappen-Satz im Welt-March (glatte, gestreifte, einfarbig hellgruene Ellipsoide,
              # 895 an der Mess-Wiese). Beweist headless: jedes Karten-Ding der Karten-Zone traegt seine Karte
              # (Stufe 2, voll), keins einen Satz, jenseits des Horizonts geraeumt, am Radius dieselben Slots.
              # Der Selbsttest macht den alten Weg (A, D) und einen injizierten Satz (B) rot.
              run: npm run gate:fernwald

            - name: Weg-Boden (der Siedlungs-Weg ist Boden, kein schwebendes Quad)
              if: matrix.gruppe == 12
              # V18.530: Strassen, Feldwege, Platz und Aecker lagen als 0,14-m-Box-Streifen auf der Gesetz-Hoehe -
              # harte Kanten, schwarze Naht-Linien, Gras durch den Weg. Jetzt malt _stlWegeBuild sie in die
              # Wege-Karte (Boden-Shader + Wiese lesen dieselben Bytes): kein flacher Streifen im Pool, weicher Rand,
              # Konsum belegt. Der Selbsttest macht einen injizierten Boden-Streifen und eine harte Kante rot.
              run: npm run gate:weg-boden

            - name: Foundry-Impostor auf dem EINEN Haupt-Renderer (P5 — kein Bake-iframe mehr)
              if: matrix.gruppe == 18
              # P5: der Impostor-Atlas backt über den Haupt-Renderer-RTT (foundry-Record + LOD1-Bake-Leaves)
              # statt über ein GL-Bake-iframe. Beweist headless die MECHANIK (foundry-Record, kein asset-foundry-
              # iframe im DOM, die drei iframe-Methoden geschnitten); der Atlas-LOOK ist das Schöpfer-Auge (GPU).
              run: npm run gate:foundry-impostor

            - name: Asset-Inventur (H3, Nervensystem Phase γ — Zensus + requested ⊆ visible|cached)
              if: matrix.gruppe == 12
              # DIE EINE INVENTUR-LINSE (aus dem Silhouetten-Zensus gewachsen, Gesetz #0), zwei Hälften:
              # (1) ZENSUS — jeder sichtbare Emitter der Szene wird über IDENTITÄT klassifiziert
              # (Studio [inkl. der Nah-Streu-Senken über ihren Leaf-Key] · Substanz [inkl. der gestempelten Bau-Quellen
              # boden-satz/wetter-regen] · Entscheid · VERLETZUNG fail-closed) → 0 Fremd-Silhouetten.
              # (2) INVENTUR — jeder on-demand angefragte Foundry-Key (f.requested) ist am Ende resident
              # (f.cache) oder sichtbar attestiert (fscatter/f:/fimp:/Gras-Memo); LRU-Räumungen (f.lruEvicted)
              # sind bewusst, kein Verlust → 0 verlorene Keys = das stille Verhungern (V18.309-Klasse) ist
              # strukturell laut. Selbst-Tests: injizierte Fremd-Emitter + synthetisch verlorener Key → rot.
              run: npm run gate:asset-inventory

            - name: Die Slot-Linse — ein freier Slot und eine leere Hülle zeichnen nie, in keinem Pass
              if: matrix.gruppe == 9
              # Jede Instanz-Senke ist DICHT: _archGroupFree zieht die letzte Instanz in die Lücke (_instanzUmzug), count
              # schreibt nur _instanzZahl, eine leere Senke ist unsichtbar. Null-Renderer + Foundry an, Wander-Sequenz
              # (fort und zurück, sieben Umzüge): nach jedem Umzug je Gruppe count gegen die Lebenden, Marke i trägt Slot i,
              # keine Null-3×3 — jeder Befund mit Senke · Pass · Dreiecken. Quelle: kein count an _instanzZahl vorbei, keine
              # Free-Liste, kein Shader-Riegel. Selbsttest: ein freier Slot, eine sichtbare leere Hülle, eine count-Zeile → rot.
              run: npm run gate:freie-slots

            - name: Die Saison ist eine Farbe (V18.527) — uSeasonMul nach dem Studio-Gesetz, kein Neubau
              if: matrix.gruppe == 3
              # Jeder Foundry-Körper und jede Karte ist Golden-Sommer gebacken; das Jahr trägt die EINE Uniform
              # uSeasonMul. Node-Orakel: _saisonMul des Stamms == seasonColors + uSeasonMul-Zeile der Studio-Shell
              # (64 Phasen, Sommer exakt x1); die Stützstellen leben NUR im SAISON_GESETZ (foundry-core); Nah-Wiese,
              # Foundry-Laub/-Gras und Karten-Stoff lesen die Uniform. --selftest zuerst: fünf Brüche → rot.
              run: npm run gate:season-meadow

            - name: S4 Impostor eager + Werkstatt-L2-Billboard (Studio-Modell, Wand 4/5)
              if: matrix.gruppe == 8
              # S4: der Impostor bäckt EAGER (kein `_frameOverBudget`-Gate mehr in `_tickImpostorBake` —
              # der ferne Wald ist über Budget WEIL seine Bäume noch schwere Geometrie tragen; der Bake
              # SENKT die Last, er darf nicht vom Budget blockiert werden; weiter ein RTT/Frame gedeckelt).
              # Und die Werkstatt zeigt auf der L2-Baumstufe das 8-Winkel-Billboard (InstancedMesh aus dem
              # Foundry-Impostor), NICHT die schwere L2-Geometrie. Null-Renderer, hardware-unabhängig:
              # Source-Proben + Behavioral (der Aufruf @lod2 liefert die 6-Vertex-Impostor-Kreuz-Geometrie).
              run: npm run gate:s4-impostor-workshop

            - name: Das Nervensystem (die Pipeline-Abnahme — ein neues Vorlage-Asset fließt automatisch)
              if: matrix.gruppe == 3
              # DER PIPELINE-BEWEIS: (A) die EINE Platzierungs-Quelle (PORTAL_RENDER_CONFIG.placement in
              # foundry-core), die der Studio-Wald SELBST liest (kein lokales SCALE-Literal); (B) sie
              # kommt live durch die Brücke an; (C) eine Daten-Mutation ändert die Welt-Skala SOFORT
              # (live gewinnt gegen jeden Hardcode-Spiegel); (D) ein NEUES kind:tree-Preset registriert
              # sich als Auto-Blueprint + wird vom Wald-Generator gestreut — ohne AnazhRealm-Edit.
              run: npm run gate:nervensystem

            - name: Der Zweit-Kern (Studio-Vertrag Phase 1 — vehicle-core dockt an, W7b)
              if: matrix.gruppe == 9
              # DER ZWEIT-KERN-BEWEIS: der Foundry-Worker importiert vehicle-core (v1.1 N7.2), das
              # LIVE-Buch trägt die kind:vehicle-Presets, der N7.5-Merge lebt am EINEN Ingest-
              # Chokepoint (first-wins, disjunkt, fail-closed [0]), der Auto-Blueprint fahrzeug_<id>
              # entsteht + der Worker liefert das Fahrzeug-Asset — ohne eine Zeile AnazhRealm-Edit.
              run: npm run gate:nervensystem-vehicle

            - name: Die Place-Policy-Weiche (N5/H8 — wie eine Buch-Art in die Welt kommt)
              if: matrix.gruppe == 1
              # DER PLACE-BEWEIS (Phase δ, headless foundry-ON): die EINE Auflösung (_placePolicyFor —
              # Rezept-fx.place führt, sonst die placeExtra-Ableitung) + der EINE Dispatch-Chokepoint
              # (_placeDispatch). (a) tree ohne place → forest, Nischen-Liste BYTE-GLEICH zur alten
              # Regel; (b) vehicle → none; (c) H8: fx.place {mode:none} auf tree → Katalog ja, Wald-
              # Nische nein (disjunkt); (d) site-Rezept (N5.6) registriert + siteTag als Daten, streut
              # nicht; (e) must-ignore/must-preserve unbekannter Felder. Inklusive Selbst-Test
              # (Verletzungs-Injektion: none-Art erscheint doch → die Detektion feuert).
              run: npm run gate:place-policy

            - name: Das Lab-Fahrprofil (N6/H7 — drive aus der EINEN Lab-Formel)
              if: matrix.gruppe == 6
              # DER DRIVE-BEWEIS (Phase δ, headless foundry-ON): exportDrive (vehicle-core) leitet
              # die Host-Fahr-Skalare aus DENSELBEN Primitiven ab, die die Garage-Probefahrt fährt
              # (carPhys + FAHR + Federrate — die Konstanten leben seit N6.1 im Kern, die Shell
              # LIEST sie); die Brücke rechnet fx.fahrprofil beim Buch-Bau (kein eingefrorenes
              # Duplikat). (a) das Buch trägt fahrprofil 5/5; (b) H7: GT vs Supersport messbar
              # verschieden; (c) _vehicleProfile(fahrzeug_gt) fährt die Lab-Werte, fahrzeug_wagen
              # (kein Buch) die Emergenz byte-gleich; (d) Formel-Parität Kern==Probefahrt-Primitive;
              # (e) Selbst-Test (verfälschtes fahrprofil → Divergenz erkannt). Der Bewegungs-Loop
              # bleibt EIN Pfad (ride.kAcc/kBrake/topSpeedMul nur in _loopPlayerMovement).
              run: npm run gate:vehicle-drive

            - name: Die Fahr-Linse des Lebens (Welle L — der Ritt im echten Spiel-Takt)
              if: matrix.gruppe == 7
              # DER RITT DURCH DEN ECHTEN FRAME (_gameLoopTick: Akkumulator · Sim-Schritte · Interpolation · Frame-Tick,
              # wechselnde Frame-Zeiten 8–33 ms, headless foundry-ON): GT geradeaus, GT am Hang ohne Taste, Pferd —
              # Teleport-Zähler 0, Sim-Weg = Fahr-Weg, der Reiter sitzt (nie „in der Luft"), keine Gier ohne Lenkung.
              # Befund 06.10.: 114 von 114 Frames Teleport, 25,95 m simuliert gegen 10,27 m gefahren, 84° Gier am Hang.
              # Statische Wand: der Sitz lebt im Sim-Schritt, der Frame-Tick schreibt nie den Reiter. Inklusive Selbst-Test.
              # RM (fahrzeug.K5): Glatt · Drift · Hang — die Federung im gezeichneten Bild antwortet dem Boden-Stoß und wankt im
              # Drift, das Rumble am Stub-Pad folgt Schlupf und Stoß, die Stimme schweigt nach dem Absteigen; die Mutante ROT.
              # VK (PFLICHT-OFFEN C): der Verkehr der Metropole (stadt-voll) um 10 und 23 Uhr je 40 s — jeder Wagen des Gesetzes
              # fährt mit seinem Fahrer, keiner steckt, 0 Berührungen mit Leib und Wagen, 0 Stoß, Sim-Takt ≤ 1 ms (~2 min).
              run: npm run gate:fahr-leben

            - name: Die Labor-Linse der Garage (Welle L — Maus, HUD, Tacho, Preset, Kultur)
              if: matrix.gruppe == 17
              # DIE PROBEFAHRT-WERKSTATT WIE DER SCHOEPFER SIE BEDIENT (worlds/garage, r128 WebGL, kopflos): Orbit-Zug und
              # Umsehen ohne Seitenfehler (vorher ReferenceError dragging je Mausbewegung), der Fahr-HUD als Flex-Band,
              # der Tacho in km/h aus FAHR.kmh (vorher x12), Preset-Wechsel und erstes Laden ohne Leck (P = DEFAULT_P +
              # Preset + Kultur), die Kultur abwaehlbar. Inklusive Selbst-Test.
              run: npm run gate:garage-labor

            - name: Der Gang der Studio-Seiten (Studio-Huelle H3 H4 H6 — je Seite Netz, Sitzung, Ofen-L0)
              if: matrix.gruppe == 16
              # JE SEITE DER HUELLE EIN BESUCH (worlds/<welt>/index.html, Rezept linse). H6 ihre Anfragen: eine Engine-Kopie im Studio-Baum
              # (worlds/*/lib/, r128 · r130 · r183) oder das r160-UMD ist ROT beim Namen, wer three laedt, laedt vendor/three.webgpu
              # (r184); laedt eine Seite die Welt (index.html, stamm/), ist die isolierte Buehne aufgeloest. Die Ratsche nennt,
              # wer noch fremd laedt. Befund 18.10. an 5ae6bdfe: die garage laedt terrain/lib/three-r128 (2 von 11 Seiten sauber).
              # H3 die Sitzung (Strg+Z nimmt den Schieber zurueck), H4 die L0 eines Ofen-Labors auf seiner Welt-Zeile (Kosten-Leiste).
              run: node scripts/diag-studio-huelle.cjs --engine

            - name: Der ε-Beweis (Nervensystem TEIL VIII Punkt 4 — porta-core dockt nur über Daten an)
              if: matrix.gruppe == 13
              # DER ε-BEWEIS: die Tor-Domäne dockt AUSSCHLIESSLICH über die Checkliste §ε an —
              # Manifest-Zeile (porta-core, __portaCore) + KIND_POLICY-gate-Zeile + tor_basis-
              # Donor-DATENBLOCK + fx.place-Rezept-Daten; der Stamm bekam KEINEN neuen kind-Zweig
              # (M8, Diff-Beweis). Statisch (Manifest/Policy/Donor/kindStages/place als Daten) +
              # Browser foundry-ON (7 Tor-Rezepte im LIVE-Buch · kindStages.gate [0] gemerged ·
              # Auto-Blueprint tor_drachentor am EINEN Chokepoint · Tor-Asset end-to-end durch den
              # Worker · site streut nicht [N5.6] · Fail-Closed-Clamp auf Stufe 0). Inklusive
              # Selbst-Test (injizierte Verletzungen feuern).
              run: npm run gate:nervensystem-porta

            - name: Der ε-Beweis Schmiede (W-A4a — schmiede-core dockt nur über Daten an)
              if: matrix.gruppe == 11
              # DER ε-BEWEIS DER WAFFEN-DOMÄNE (Katalysator-Bogen): die Klingen-Domäne dockt
              # AUSSCHLIESSLICH über die Checkliste §ε an — Manifest-Zeile (schmiede-core,
              # __schmiedeCore) + KIND_POLICY-weapon-Zeile + geraet_schwert-Donor-DATENBLOCK +
