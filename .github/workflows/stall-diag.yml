name: Stall-Diagnose

# K67 — WEGWERF-LAUF: gate:webgl-probe N-mal je Läufer auf ubuntu-latest (swiftshader-GL), die Stall-Akte der Boot-Lib
# nennt den Täter. Lebt nur auf dem Zweig webgl-stall und fällt vor dem letzten Push.
# Diagnose 7 (Beweis): die Linse wünscht weniger Bewegung (software-gpu.cjs, CPU_COMPOSITOR), je Lauf die CPU-Bilanz der
# Fäden von GPU- und Renderer-Prozess (/proc); vorweg je Läufer einmal gate:kamera-leib (WebGPU auf swiftshader).
on:
    push:
        branches: [webgl-stall]

jobs:
    probe:
        name: probe ${{ matrix.laeufer }}
        strategy:
            fail-fast: false
            matrix:
                laeufer: [1, 2, 3, 4, 5, 6, 7, 8]
        runs-on: ubuntu-latest
        timeout-minutes: 50
        env:
            CI_KLASSE: gpu
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Cache-Schlüssel
              id: schluessel
              run: node scripts/ci-schluessel.cjs
            - uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ steps.schluessel.outputs.npm }}
                  restore-keys: npm-${{ runner.os }}-
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/puppeteer
                  key: puppeteer-${{ runner.os }}-${{ steps.schluessel.outputs.chrome }}
                  restore-keys: puppeteer-${{ runner.os }}-
            - name: System-Libs
              run: |
                  nproc; free -m; lscpu | grep -i "model name"
            - run: npm ci --no-audit --no-fund
            - name: Selbsttest der Stall-Akte
              run: node scripts/lib/welt-boot.cjs --selbsttest
            - name: Faden-Bilanz
              shell: bash
              run: |
                  cat > /tmp/faeden.cjs <<'JS'
                  // je Sekunde die Fäden aller GPU- und Renderer-Prozesse; bei SIGTERM die Bilanz je Faden-Klasse (CPU-Sekunden)
                  const fs = require("fs");
                  const letzt = new Map();
                  const probe = () => {
                    for (const pid of fs.readdirSync("/proc").filter((p) => /^\d+$/.test(p))) {
                      let typ;
                      try { const c = fs.readFileSync(`/proc/${pid}/cmdline`, "utf8"); if (!/chrome/.test(c)) continue; typ = (c.match(/--type=([\w-]+)/) || [, "browser"])[1]; } catch (e) { continue; }
                      if (typ !== "gpu-process" && typ !== "renderer") continue;
                      let tasks; try { tasks = fs.readdirSync(`/proc/${pid}/task`); } catch (e) { continue; }
                      for (const t of tasks) {
                        try {
                          const st = fs.readFileSync(`/proc/${pid}/task/${t}/stat`, "utf8");
                          const rest = st.slice(st.lastIndexOf(")") + 2).split(" ");
                          const name = st.slice(st.indexOf("(") + 1, st.lastIndexOf(")")).replace(/<[^>]*>$/, "<>").replace(/\d+$/, "");
                          letzt.set(`${pid}/${t}`, { k: `${typ === "gpu-process" ? "gpu" : "ren"}:${name}`, ticks: Number(rest[11]) + Number(rest[12]) });
                        } catch (e) {}
                      }
                    }
                  };
                  const uhr = setInterval(probe, 1000);
                  process.on("SIGTERM", () => {
                    clearInterval(uhr); probe();
                    const g = new Map();
                    for (const v of letzt.values()) g.set(v.k, (g.get(v.k) || 0) + v.ticks / 100);
                    const z = [...g].sort((a, b) => b[1] - a[1]);
                    const sum = (p) => z.filter(([k]) => k.startsWith(p)).reduce((s, [, v]) => s + v, 0);
                    console.log(`BILANZ gpu ${sum("gpu:").toFixed(0)} s · ren ${sum("ren:").toFixed(0)} s | ` + z.slice(0, 8).map(([k, v]) => `${k} ${v.toFixed(0)}`).join(" · "));
                    process.exit(0);
                  });
                  JS
            - name: gate:kamera-leib (WebGPU auf swiftshader, einmal je Läufer)
              shell: bash
              run: |
                  set +e
                  node /tmp/faeden.cjs > /tmp/bilanz.txt & FP=$!
                  T0=$(date +%s); npm run -s gate:kamera-leib > /tmp/kl.log 2>&1; E=$?
                  D=$(( $(date +%s) - T0 )); kill -TERM $FP; wait $FP
                  tail -4 /tmp/kl.log; grep -h "stall-akte] URTEIL" /tmp/kl.log | head -3
                  echo "KAMERA-LEIB ${{ matrix.laeufer }} EXIT=$E DAUER=$D s $(cat /tmp/bilanz.txt)"
            - name: webgl-probe in Folge
              shell: bash
              run: |
                  set +e; ROT=0; N=12
                  for i in $(seq 1 $N); do
                    echo "::group::Lauf $i (Läufer ${{ matrix.laeufer }})"
                    node /tmp/faeden.cjs > /tmp/bilanz.txt & FP=$!
                    T0=$(date +%s)
                    node scripts/diag-webgl-probe.cjs; E=$?
                    D=$(( $(date +%s) - T0 ))
                    kill -TERM $FP; wait $FP
                    echo "::endgroup::"
                    echo "LAUF ${{ matrix.laeufer }}.$i ARM=N EXIT=$E DAUER=$D s $(cat /tmp/bilanz.txt)"
                    [ $E -ne 0 ] && ROT=$((ROT+1))
                  done
                  echo "ROT=$ROT von $N"
                  exit $ROT
