name: Stall-Diagnose

# K67 — WEGWERF-LAUF: gate:webgl-probe N-mal je Läufer auf ubuntu-latest (swiftshader-GL), die Stall-Akte der Boot-Lib
# nennt den Täter. Lebt nur auf dem Zweig webgl-stall und fällt vor dem letzten Push.
on:
    push:
        branches: [webgl-stall]

jobs:
    probe:
        name: probe ${{ matrix.laeufer }}
        strategy:
            fail-fast: false
            matrix:
                laeufer: [1, 2, 3, 4, 5, 6, 7, 8]
        runs-on: ubuntu-latest
        timeout-minutes: 40
        env:
            CI_KLASSE: gpu
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Cache-Schlüssel
              id: schluessel
              run: node scripts/ci-schluessel.cjs
            - uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ steps.schluessel.outputs.npm }}
                  restore-keys: npm-${{ runner.os }}-
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/puppeteer
                  key: puppeteer-${{ runner.os }}-${{ steps.schluessel.outputs.chrome }}
                  restore-keys: puppeteer-${{ runner.os }}-
            - name: System-Libs
              run: |
                  SO="libnss3.so libatk-1.0.so.0 libatk-bridge-2.0.so.0 libcups.so.2 libdrm.so.2 libxkbcommon.so.0 libXcomposite.so.1 libXdamage.so.1 libXfixes.so.3 libXrandr.so.2 libgbm.so.1 libpango-1.0.so.0 libcairo.so.2 libasound.so.2"
                  DA=1; for so in $SO; do ldconfig -p | grep -qF "$so (" || DA=0; done
                  echo "System-Libs da=$DA"; nproc; free -m; lscpu | grep -i "model name"
            - run: npm ci --no-audit --no-fund
            - name: Selbsttest der Stall-Akte
              run: node scripts/lib/welt-boot.cjs --selbsttest
            - name: WebGL-Familie (jedes Gate mit einer art-webgl-Linse) - je Läufer ein Viertel
              if: matrix.laeufer <= 4
              shell: bash
              run: |
                  set +e
                  GATES=$(node - <<'JS'
                  const p = require("./package.json").scripts, fs = require("fs");
                  const raus = new Set(["gate:perf-parity", "gate:webgl-probe"]);
                  console.log(Object.entries(p).filter(([k, v]) => k.startsWith("gate:") && !raus.has(k) && [...v.matchAll(/scripts\/([\w.-]+\.cjs)/g)].some((m) => { try { return /art: "webgl"/.test(fs.readFileSync("scripts/" + m[1], "utf8")); } catch (e) { return false; } })).map(([k]) => k).join(" "));
                  JS
                  )
                  i=0; ROT=0
                  for g in $GATES; do
                    i=$((i+1)); [ $(( i % 4 + 1 )) -eq ${{ matrix.laeufer }} ] || continue
                    T0=$(date +%s); npm run -s $g > /tmp/g.log 2>&1; E=$?
                    echo "GATE $g EXIT=$E DAUER=$(( $(date +%s) - T0 )) s"
                    if [ $E -ne 0 ]; then ROT=$((ROT+1)); tail -30 /tmp/g.log; fi
                    grep -hE "stall-akte\] (═══|URTEIL)" /tmp/g.log | head -6
                  done
                  echo "GATES ROT=$ROT"
            - name: webgl-probe in Folge
              shell: bash
              run: |
                  set +e; ROT=0; N=12
                  # Läufer 7 und 8 fahren die Reihe der Gruppe 18 vor jeder Probe (der Kontext der Risse)
                  for i in $(seq 1 $N); do
                    if [ ${{ matrix.laeufer }} -ge 7 ] && [ $i -le 6 ]; then
                      for g in sippen-wirt pack-contract weltakt-wache himmel-tag nervensystem-schmiede; do npm run -s gate:$g > /dev/null 2>&1 || echo "VORLAUF $g ROT"; done
                    fi
                    echo "::group::Lauf $i (Läufer ${{ matrix.laeufer }})"
                    T0=$(date +%s)
                    node scripts/diag-webgl-probe.cjs; E=$?
                    echo "LAUF ${{ matrix.laeufer }}.$i EXIT=$E DAUER=$(( $(date +%s) - T0 )) s"
                    echo "::endgroup::"
                    [ $E -ne 0 ] && ROT=$((ROT+1))
                  done
                  echo "ROT=$ROT von $N"
                  exit $ROT
