name: Diag-Linux-Geraet

on:
    push:
        branches: ["diag/**"]

jobs:
    nah:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
            - name: System-Libs
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends                     libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2                     libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2                     libgbm1 libpango-1.0-0 libcairo2 libasound2t64
            - name: Dependencies
              run: npm ci --no-audit --no-fund
            - name: npm run gate:analog-nah
              run: npm run gate:analog-nah
